<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1338">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Puck Pop</title>

<style>
/* ===================================================================
   PUCK POP — Cam (glassmorphism) arayüz sistemi
   =================================================================== */
:root{
  --ink:#0e1533;
  --page:#070b22;
  --acc:#ff4a5e;          /* dünya vurgu rengi (JS değiştirir) */
  --acc2:#2a6cff;
  --gold:#ffc531;
  --green:#34e6a0;
  --txt:#fff;
  --txt2:rgba(255,255,255,.72);
  --glass:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.12));
  --glass-strong:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.1) 55%,rgba(255,255,255,.18));
  --glass-dark:linear-gradient(145deg,rgba(20,30,90,.55),rgba(8,12,44,.55));
  --blur:blur(20px) saturate(180%);
  --blur-s:blur(10px) saturate(160%);
  --shadow:0 10px 30px rgba(3,6,28,.5),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);font-family:var(--font);color:var(--txt);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;transition:background .6s}
#stage{position:relative;width:400px;height:700px;flex:none;overflow:hidden;transform-origin:center center;border-radius:0}
canvas{position:absolute;left:0;top:0;width:400px;height:700px;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-appearance:none;appearance:none}
svg{display:block}

/* ---------- Cam yüzey ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);border-radius:24px}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.8),rgba(255,255,255,.1) 32%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass.strong{background:var(--glass-strong)}
.glass.dark{background:var(--glass-dark)}
.glass.s{-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s)}
body.lowfx .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(145deg,rgba(60,80,170,.78),rgba(20,30,100,.82))}
body.lowfx .glass.dark{background:rgba(10,15,55,.88)}

/* ---------- Düğmeler ---------- */
.gbtn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.gbtn:active,.pill:active,.cta:active,.pu:active .btn,.node:active .nb,.item:active,.tab:active{transform:scale(.92)}
.gbtn svg{width:20px;height:20px}
.pill{position:relative;display:flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 8px;border-radius:18px;font-weight:800;font-size:16px;transition:transform .14s}
.cta{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:200px;padding:14px 30px;border-radius:28px;font-weight:800;font-size:19px;letter-spacing:.01em;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc) 60%,color-mix(in srgb,var(--acc) 82%,#000));
  box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 55%,transparent),0 2px 0 rgba(0,0,0,.18),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.55);text-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .14s cubic-bezier(.3,1.6,.5,1),filter .2s}
.cta:hover{filter:brightness(1.06)}
.cta.blue{--acc:#2f7bff}
.cta.green{--acc:#1fc98a}
.cta.gold{--acc:#f0a81a}
.cta.ghost{background:var(--glass);-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.3);font-size:16px;padding:11px 24px}
.cta.sm{font-size:16px;padding:11px 22px;min-width:180px}
.cta[disabled],.cta.off{filter:grayscale(.9) brightness(.7);pointer-events:none}
.cta svg{width:20px;height:20px}
.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.055)}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px 0;pointer-events:none;z-index:5;transition:opacity .3s,transform .3s}
#hud>*{pointer-events:auto}
body.nohud #hud,body.nohud #dock{opacity:0;pointer-events:none;transform:translateY(-8px)}
body.nohud #dock{transform:translateY(8px)}
#mid{text-align:center;line-height:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:1px}
#lvlrow{display:flex;align-items:center;gap:7px}
#lvl{font-weight:900;font-size:20px;letter-spacing:.01em;text-shadow:0 2px 6px rgba(3,6,28,.6)}
.tierchip{font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px 3px;border-radius:9px;color:var(--c,#fff);background:rgba(10,15,50,.5);border:1px solid color-mix(in srgb,var(--c,#fff) 70%,transparent);box-shadow:0 0 12px var(--g,transparent)}
#shots{display:flex;gap:5px;justify-content:center;min-height:16px;padding:5px 10px;border-radius:14px;background:rgba(8,12,44,.42);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s)}
.pk{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#59628c,#0b0e20 70%);border:2px solid var(--acc);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s,filter .3s}
.pk.used{transform:scale(.5);opacity:.3;filter:grayscale(1)}
.pk.new{animation:pkIn .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pkIn{from{transform:scale(0)}to{transform:scale(1)}}
#hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#coins{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;line-height:1}
#coins i,.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7be,#ffc531 55%,#d98e00);border:2px solid #fff3b0;box-shadow:inset 0 -2px 0 #b8760099,0 0 10px #ffc53155;flex:none}
#coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.16)}}
#left{height:26px;font-size:13px;padding:0 10px 0 7px;gap:5px;border-radius:13px}
#left svg{width:14px;height:14px}
#left .bar{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
#left .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#b7ffe0);border-radius:3px;transition:width .4s cubic-bezier(.3,1.4,.5,1)}

/* ---------- Alt çubuk (güçlendiriciler) ---------- */
#dock{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:6px;padding:8px 10px 6px;z-index:5;border-radius:30px;transition:opacity .3s,transform .3s}
.pu{position:relative;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.pu .btn{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.28),rgba(255,255,255,.04) 70%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 10px rgba(0,0,0,.18),0 4px 12px rgba(3,6,28,.4);transition:transform .14s,box-shadow .2s,border-color .2s}
.pu .btn svg{width:26px;height:26px}
.pu small{font-size:10.5px;font-weight:800;opacity:.9;text-shadow:0 1px 2px rgba(3,6,28,.6)}
.pu .cnt{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;border-radius:10px;background:linear-gradient(#ff6c7e,#e5384a);border:1.5px solid #fff;font-size:11.5px;font-weight:900;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pu .cnt.ad{background:linear-gradient(#5b9bff,#2a6cff)}
.pu .cnt svg{width:10px;height:10px;margin-left:1px}
.pu.on .btn{border-color:var(--gold);box-shadow:0 0 0 3px #ffc53144,0 0 22px #ffc531bb,inset 0 1px 0 rgba(255,255,255,.7);animation:armed 1s infinite}
@keyframes armed{50%{transform:scale(1.08)}}
.pu.dim{opacity:.4;pointer-events:none}

/* ---------- Katmanlar ---------- */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:22px;z-index:20}
.scr.show{display:flex;animation:fadeIn .38s both}
.scr.modal{background:radial-gradient(ellipse at 50% 42%,rgba(8,14,56,.55),rgba(3,6,24,.82));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.scr.screen{background:linear-gradient(180deg,rgba(6,10,40,.5),rgba(4,6,28,.88))}
.scr.z30{z-index:30}.scr.z40{z-index:40}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{position:relative;width:100%;max-width:344px;padding:22px 18px 22px;border-radius:30px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:cardIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(46px) scale(.9);opacity:0}}
.card h2{margin:0;font-weight:900;font-size:28px;letter-spacing:-.01em;text-shadow:0 2px 8px rgba(3,6,28,.5)}
.card h3{margin:0;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt2)}
.card p{margin:0;font-size:15px;font-weight:600;color:rgba(255,255,255,.88);line-height:1.35}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:14px;font-weight:800;font-size:13px;background:rgba(8,12,44,.4);border:1px solid rgba(255,255,255,.2)}
.chip svg{width:15px;height:15px}
.xbtn{position:absolute;right:12px;top:12px;width:34px;height:34px;z-index:2}
.xbtn svg{width:16px;height:16px}

/* ---------- Başlık ekranı ---------- */
#scr-title{justify-content:flex-start;padding-top:128px;gap:0;background:radial-gradient(ellipse at 50% 30%,rgba(10,16,60,.25),rgba(3,5,22,.82));-webkit-backdrop-filter:blur(7px) saturate(140%);backdrop-filter:blur(7px) saturate(140%)}
.logo{font-weight:900;font-size:78px;line-height:.86;letter-spacing:-.035em;text-shadow:0 4px 0 var(--acc),0 10px 0 rgba(3,6,28,.6),0 20px 40px rgba(0,0,0,.5);animation:float 4s ease-in-out infinite}
.logo span{display:block}
.logo span:nth-child(2){background:linear-gradient(180deg,#fff,#cde6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 var(--acc)) drop-shadow(0 10px 0 rgba(3,6,28,.6))}
@keyframes float{50%{transform:translateY(-8px)}}
.tag{margin-top:26px;font-size:16px;font-weight:700;color:var(--txt2);letter-spacing:.01em}
#title-btns{position:absolute;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:16px}
#title-btns .cta{min-width:220px;font-size:23px;padding:16px 34px}
#title-ic{display:flex;gap:14px}
#title-prog{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;font-size:13px;font-weight:700;color:var(--txt2)}

/* ---------- Dünya haritası ---------- */
#scr-map{padding:0;justify-content:flex-start;gap:0;background:var(--page)}
#maphead{position:absolute;left:10px;right:10px;top:10px;height:56px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;z-index:3;border-radius:28px}
#maphead .ttl{font-weight:900;font-size:19px;text-align:center;line-height:1.1}
#maphead .ttl small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2)}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
#mapScroll::-webkit-scrollbar{display:none}
.mapInner{position:relative;width:400px}
.wsec{position:absolute;left:0;width:400px;overflow:hidden}
.wsec::before{content:"";position:absolute;inset:0;background:var(--wbg);opacity:1}
.wsec .deco{position:absolute;inset:0;background-image:var(--wdeco);background-size:var(--wds,120px 120px);opacity:.7}
.wban{position:absolute;left:50%;transform:translateX(-50%);width:318px;padding:11px 16px 12px;text-align:center;border-radius:22px;z-index:2}
.wban b{display:block;font-size:20px;font-weight:900;letter-spacing:.01em}
.wban span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt2)}
.wban .wp{margin-top:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.wban .wp i{display:block;height:100%;background:linear-gradient(90deg,var(--wc),#fff);border-radius:3px}
#mapSvg{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.node{position:absolute;width:64px;height:78px;margin-left:-32px;margin-top:-32px;display:flex;flex-direction:column;align-items:center;z-index:2}
.node .nb{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;transition:transform .14s cubic-bezier(.3,1.6,.5,1);
  background:var(--glass-strong);-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s);box-shadow:0 8px 18px rgba(3,6,28,.45),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -5px 10px rgba(0,0,0,.14);
  border:3px solid var(--tc);text-shadow:0 1px 3px rgba(3,6,28,.5)}
.node .nb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--tc);opacity:.35}
.node.done .nb{background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 50%,rgba(255,255,255,.4)),color-mix(in srgb,var(--tc) 22%,rgba(255,255,255,.08)))}
.node.cur .nb{animation:curPulse 1.6s ease-in-out infinite;background:linear-gradient(145deg,#fff,color-mix(in srgb,var(--tc) 60%,#fff));color:#0e1533;text-shadow:none}
.node.cur .nb::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,var(--tcg),transparent 68%);z-index:-1;animation:glowP 1.6s ease-in-out infinite}
@keyframes curPulse{50%{transform:scale(1.1)}}
@keyframes glowP{50%{opacity:.4;transform:scale(1.25)}}
.node.lock .nb{opacity:.55;filter:saturate(.4);border-color:rgba(255,255,255,.35)}
.node.lock .nb::after{display:none}
.node .nb svg{width:22px;height:22px;opacity:.85}
.nstars{display:flex;gap:1px;margin-top:5px;height:14px}
.nstars svg{width:14px;height:14px;filter:drop-shadow(0 1px 1px rgba(3,6,28,.6))}
.nstars svg.off{opacity:.3;filter:grayscale(1)}
.nlabel{position:absolute;top:2px;white-space:nowrap;font-size:11px;font-weight:800;padding:4px 9px;border-radius:10px;background:rgba(8,12,44,.55);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s);pointer-events:none}

/* ---------- Bölüm girişi ---------- */
#scr-intro{background:radial-gradient(ellipse at 50% 50%,rgba(3,6,28,.45),rgba(3,6,28,.05) 70%);justify-content:flex-start;padding-top:150px;z-index:15}
#scr-intro.show{animation:none}
.intro{width:318px;padding:20px 18px 18px;border-radius:32px;display:flex;flex-direction:column;align-items:center;gap:7px;animation:introIn .6s cubic-bezier(.2,1.5,.35,1) both,glowT 2s ease-in-out infinite .6s;--tcol:#fff}
.intro.out{animation:introOut .4s cubic-bezier(.5,0,.8,.4) both}
@keyframes introIn{from{transform:translateY(-70px) scale(.8) rotate(-3deg);opacity:0}}
@keyframes introOut{to{transform:translateY(-50px) scale(.9);opacity:0}}
@keyframes glowT{50%{box-shadow:var(--shadow),0 0 46px var(--tg)}}
.intro .wn{font-size:11.5px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--txt2)}
.intro .bn{font-size:46px;font-weight:900;letter-spacing:-.025em;line-height:1;text-shadow:0 4px 14px rgba(3,6,28,.55)}
.intro .ln{font-size:21px;font-weight:800;color:var(--gold);text-shadow:0 2px 8px rgba(3,6,28,.6)}
.intro .tb{margin-top:4px;padding:6px 20px;border-radius:16px;font-size:15px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#fff),var(--tc));box-shadow:0 0 24px var(--tg),inset 0 1px 0 rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.6);text-shadow:0 1px 2px rgba(0,0,0,.35);animation:badge 1.2s ease-in-out infinite}
@keyframes badge{50%{transform:scale(1.07)}}
.intro .chips{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.intro .tip{margin-top:5px;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.9);line-height:1.35;max-width:270px}
.intro .tap{margin-top:2px;font-size:11px;font-weight:700;color:var(--txt2);opacity:.8}

/* ---------- Sonuç / paneller ---------- */
.stars{display:flex;gap:6px;height:70px;align-items:center}
.stars svg{width:60px;height:60px;filter:drop-shadow(0 4px 6px rgba(3,6,28,.55))}
.stars svg:nth-child(2){margin-bottom:14px}
.stars svg.on{animation:starIn .7s cubic-bezier(.2,2,.4,1) both}
.stars svg.off{opacity:.22;filter:grayscale(1)}
@keyframes starIn{from{transform:scale(0) rotate(-140deg)}to{transform:scale(1) rotate(0)}}
.earn{font-weight:900;font-size:28px;display:flex;align-items:center;gap:9px;text-shadow:0 2px 8px rgba(3,6,28,.5)}
.earn .coin{width:26px;height:26px}
.par{font-size:13px;font-weight:700;color:var(--txt2)}
.newrec{font-size:12px;font-weight:900;letter-spacing:.1em;padding:4px 10px;border-radius:10px;background:linear-gradient(#ffd75e,#f0a81a);color:#4a3000;box-shadow:0 0 18px #ffc53199;animation:badge 1s infinite}

/* Seviye kartı */
.lcard .big{font-size:56px;font-weight:900;line-height:1;letter-spacing:-.03em}
.lcard .nm{font-size:22px;font-weight:800;color:var(--gold)}
.lcard .tb{padding:5px 16px;border-radius:14px;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#fff),var(--tc));box-shadow:0 0 18px var(--tg),inset 0 1px 0 rgba(255,255,255,.6)}

/* Izgara & mağaza */
.tabs{display:flex;gap:6px;padding:4px;border-radius:20px;background:rgba(8,12,44,.4);border:1px solid rgba(255,255,255,.16);width:100%}
.tab{flex:1;padding:8px 6px;border-radius:16px;font-weight:800;font-size:14px;color:var(--txt2);transition:transform .14s,background .2s,color .2s}
.tab.sel{background:var(--glass-strong);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 8px rgba(3,6,28,.3)}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-height:340px;overflow-y:auto;touch-action:pan-y;padding:2px;scrollbar-width:none}
.shopgrid::-webkit-scrollbar{display:none}
.shopgrid.two{grid-template-columns:repeat(2,1fr)}
.item{position:relative;padding:10px 6px 9px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);transition:transform .14s,border-color .2s,background .2s}
.item.sel{border-color:var(--gold);background:rgba(255,197,49,.16);box-shadow:0 0 0 3px #ffc53133}
.item canvas{position:static;width:54px;height:54px}
.item .pr{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--gold)}
.item .pr .coin{width:14px;height:14px;border-width:1.5px}

<script>
// ===== 00-util.js =====
// ============================================================================
//  PUCK POP  —  tek dosya, saf JS + Canvas  (Capacitor ile paketlenmeye hazır)
//  Modüller: util · fizik · bölümler · temalar · ses · servisler · efekt · çizim · oyun · arayüz
// ============================================================================
'use strict';

// ---------------------------------------------------------------- 0) YARDIMCILAR
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutElastic = x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1;

// Tohumlu rastgele sayı üreteci (arka plan dokuları hep aynı çıksın diye)
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Dizi üreticileri (bölüm tasarımında kullanılır)
const row = (x0, y0, x1, y1, n) => Array.from({ length: n }, (_, i) => {
  const f = n === 1 ? .5 : i / (n - 1);
  return { x: x0 + (x1 - x0) * f, y: y0 + (y1 - y0) * f };
});
const ring = (cx, cy, r, n, a0) => Array.from({ length: n }, (_, i) => {
  const a = (a0 || 0) + i * TAU / n;
  return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
});
const pyramid = (cx, y0, dy, dx, rows) => {
  const o = [];
  for (let r = 0; r < rows; r++) for (let i = 0; i <= r; i++) o.push({ x: cx - r * dx / 2 + i * dx, y: y0 + r * dy });
  return o;
};
// T: noktalara hedef tipi ekler. n=normal, g=altın, a=zırhlı, b=bomba
const T = (arr, t, extra) => arr.map(p => Object.assign({}, p, { t: t || 'n' }, extra || {}));
const mark = (arr, idx, props) => { idx.forEach(i => Object.assign(arr[i], props)); return arr; };

// ===== 01-physics.js =====
// ---------------------------------------------------------------- 1) FİZİK MOTORU
// Tamamen DOM'dan bağımsız: aynı kod Node'da çalışıp bölümleri otomatik çözer
// (atış hakkı ve "par" değerleri bu çözücüyle hesaplanıp bölümlere gömülür).
const WW = 400, WH = 700;
const FX0 = 18, FX1 = 382, FY0 = 76, FY1 = 596, CR = 34;   // buz yüzeyi
const PR = 11, TR = 10;                                    // pak ve hedef yarıçapı
const PULL = 100, VMAX = 1250, DECEL = 420, MINV = 14, MAXV = 1500, WALL_E = .96, STEP = 1 / 240;
const MUD_K = 3.1, MUD_DRAG = 1.7, BOOST_ACC = 3200, PORTAL_R = 17, PORTAL_CD = .35;
const SLICK_K = .2, WELL_G = 2300;

function mkSim(lv) {
  const s = {
    t: 0,
    puck: { x: lv.start[0], y: lv.start[1], vx: 0, vy: 0, r: PR, moving: false, bomb: false, magnet: false, pcd: 0, boostId: -1, mud: false, slick: false },
    targets: [], obst: [], zones: [], pending: [],
    shots: lv.shots, shotsMax: lv.shots, used: 0, shotPops: 0, pops: 0, events: [], noEv: false
  };
  lv.targets.forEach((g, i) => s.targets.push({
    id: i, x: g.x, y: g.y, x0: g.x, y0: g.y, r: TR, type: g.t || 'n', hp: g.t === 'a' ? 2 : 1, alive: true,
    ax: g.ax || 0, ay: g.ay || 0, sp: g.sp || 1, ph: g.ph || 0, cd: 0
  }));
  (lv.obst || []).forEach((o, i) => s.obst.push(Object.assign({ id: i, a: o.a0 || 0, x0: o.x, y0: o.y, vx: 0, vy: 0, hp: o.brk || 0, dead: false, off: false }, o)));
  (lv.zones || []).forEach((z, i) => s.zones.push(Object.assign({ id: i }, z)));
  updateDyn(s);
  return s;
}

function ev(s, o) { if (!s.noEv) s.events.push(o); }

// Yansıma: hızın yüzey normali yönündeki bileşenini tersine çevirir
function reflect(p, nx, ny, e) {
  const d = p.vx * nx + p.vy * ny;
  if (d < 0) { p.vx -= (1 + e) * d * nx; p.vy -= (1 + e) * d * ny; return -d; }
  return 0;
}

// Yuvarlak köşeli kenar çerçevesi ile çarpışma
function wallCollide(s, p) {
  let imp = 0, hx = 0, hy = 0, nx = 0, ny = 0;
  const r = p.r, ix0 = FX0 + CR, ix1 = FX1 - CR, iy0 = FY0 + CR, iy1 = FY1 - CR;
  let cx = null, cy = null;
  if (p.x < ix0) cx = ix0; else if (p.x > ix1) cx = ix1;
  if (p.y < iy0) cy = iy0; else if (p.y > iy1) cy = iy1;
  if (cx !== null && cy !== null) {
    const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy), lim = CR - r;
    if (d > lim) {
      const ux = dx / d, uy = dy / d;
      p.x = cx + ux * lim; p.y = cy + uy * lim;
      nx = -ux; ny = -uy;
      imp = reflect(p, nx, ny, WALL_E);
      hx = cx + ux * CR; hy = cy + uy * CR;
    }
  } else {
    if (p.x < FX0 + r) { p.x = FX0 + r; nx = 1; imp += reflect(p, 1, 0, WALL_E); hx = FX0; hy = p.y; }
    else if (p.x > FX1 - r) { p.x = FX1 - r; nx = -1; imp += reflect(p, -1, 0, WALL_E); hx = FX1; hy = p.y; }
    if (p.y < FY0 + r) { p.y = FY0 + r; ny = 1; imp += reflect(p, 0, 1, WALL_E); hx = p.x; hy = FY0; }
    else if (p.y > FY1 - r) { p.y = FY1 - r; ny = -1; imp += reflect(p, 0, -1, WALL_E); hx = p.x; hy = FY1; }
  }
  if (imp > 40) ev(s, { k: 'wall', x: hx, y: hy, nx, ny, s: imp });
}

// Engel ile pak arasındaki temas bilgisi (daire / dikdörtgen / dönen çubuk)
function contact(o, p) {
  if (o.dead || o.off) return null;
  let cx, cy, rr = 0, svx = o.vx || 0, svy = o.vy || 0;
  if (o.k === 'c') { cx = o.x; cy = o.y; rr = o.r; }
  else if (o.k === 'r') {
    cx = clamp(p.x, o.x - o.w / 2, o.x + o.w / 2);
    cy = clamp(p.y, o.y - o.h / 2, o.y + o.h / 2);
  } else {
    const ca = Math.cos(o.a), sa = Math.sin(o.a), dx = p.x - o.x, dy = p.y - o.y;
    const lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
    const qx = clamp(lx, -o.len / 2, o.len / 2), qy = clamp(ly, -o.th / 2, o.th / 2);
    cx = o.x + qx * ca - qy * sa; cy = o.y + qx * sa + qy * ca;
    svx = -o.w * (cy - o.y); svy = o.w * (cx - o.x);
  }
  let dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
  if (d >= p.r + rr) return null;
  if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
  return { nx: dx / d, ny: dy / d, pen: p.r + rr - d, svx, svy, px: cx, py: cy };
}

function obstHit(s, o, p) {
  const c = contact(o, p);
  if (!c) return;
  p.x += c.nx * c.pen; p.y += c.ny * c.pen;
  const e = o.k === 'c' ? 1 : .96;
  const rvx = p.vx - c.svx, rvy = p.vy - c.svy, d = rvx * c.nx + rvy * c.ny;
  let imp = 0;
  if (d < 0) {
    imp = -d;
    const f = (1 + e) * d;
    p.vx = rvx - f * c.nx + c.svx; p.vy = rvy - f * c.ny + c.svy;
  }
  // Yuvarlak tamponlar pakı hızlandırır
  if (o.k === 'c' && imp > 0) {
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 0) { const ns = Math.min(MAXV, sp * 1.07 + 30); p.vx *= ns / sp; p.vy *= ns / sp; }
  }
  const sp2 = Math.hypot(p.vx, p.vy);
  if (sp2 > MAXV) { p.vx *= MAXV / sp2; p.vy *= MAXV / sp2; }
  if (o.brk && imp > 120) {
    o.hp--;
    if (o.hp <= 0) { o.dead = true; ev(s, { k: 'brkdie', id: o.id, x: o.x, y: o.y, w: o.w, h: o.h }); }
    else ev(s, { k: 'brk', id: o.id, x: c.px, y: c.py, hp: o.hp });
    return;
  }
  if (imp > 30) ev(s, { k: 'obst', id: o.id, x: c.px, y: c.py, s: imp, o: o.k });
}

// Bölgeler: çamur (yavaşlatır), hızlandırıcı (iter), portal (ışınlar)
function applyZones(s, p, dt) {
  p.mud = false; p.slick = false;
  let inBoost = -1;
  for (const z of s.zones) {
    const d = Math.hypot(p.x - z.x, p.y - z.y);
    if (z.k === 'mud') {
      if (d < z.r) p.mud = true;
    } else if (z.k === 'slick') {
      if (d < z.r) p.slick = true;
    } else if (z.k === 'well') {
      if (d < z.r && d > 1) {
        const a = (z.s || 1) * WELL_G * (1 - d / z.r) * Math.min(1, d / 16), ux = (z.x - p.x) / d, uy = (z.y - p.y) / d;
        p.vx += ux * a * dt; p.vy += uy * a * dt;
      }
    } else if (z.k === 'boost') {
      if (d < z.r) {
        inBoost = z.id;
        p.vx += Math.cos(z.a) * BOOST_ACC * dt;
        p.vy += Math.sin(z.a) * BOOST_ACC * dt;
        if (p.boostId !== z.id) ev(s, { k: 'boost', x: z.x, y: z.y, a: z.a, id: z.id });
      }
    } else if (z.k === 'portal') {
      if (p.pcd <= 0 && d < PORTAL_R) {
        const out = s.zones.find(q => q.k === 'portal' && q.ch === z.ch && q.id !== z.id);
        if (out) {
          ev(s, { k: 'portal', x: z.x, y: z.y, x2: out.x, y2: out.y, ch: z.ch });
          p.x = out.x; p.y = out.y; p.pcd = PORTAL_CD;
        }
      }
    }
  }
  p.boostId = inBoost;
}

function stepPuck(s, p, dt) {
  if (p.pcd > 0) p.pcd -= dt;
  const sp = Math.hypot(p.vx, p.vy);
  const dec = DECEL * (p.mud ? MUD_K : p.slick ? SLICK_K : 1);
  const ns = sp - dec * dt;
  if (ns <= MINV) { p.vx = p.vy = 0; p.moving = false; return; }
  let f = ns / sp;
  if (p.mud) f *= Math.max(0, 1 - MUD_DRAG * dt);
  p.vx *= f; p.vy *= f;
  if (p.magnet && s.targets) {
    let best = null, bd = 120;
    for (const g of s.targets) {
      if (!g.alive) continue;
      const d = Math.hypot(g.x - p.x, g.y - p.y);
      if (d < bd) { bd = d; best = g; }
    }
    if (best) {
      const a = 1900 * (1 - bd / 120), ux = (best.x - p.x) / bd, uy = (best.y - p.y) / bd;
      p.vx += ux * a * dt; p.vy += uy * a * dt;
    }
  }
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (s.zones && s.zones.length) applyZones(s, p, dt);
  const sp1 = Math.hypot(p.vx, p.vy);
  if (sp1 > MAXV) { p.vx *= MAXV / sp1; p.vy *= MAXV / sp1; }
  wallCollide(s, p);
  for (const o of s.obst) obstHit(s, o, p);
}

function blast(s, x, y, r) {
  ev(s, { k: 'blast', x, y, r });
  for (const q of s.targets) if (q.alive && Math.hypot(q.x - x, q.y - y) < r + q.r) hitTarget(s, q, 2, false);
}

function hitTarget(s, g, dmg, byPuck) {
  g.hp -= dmg; g.cd = .25;
  if (g.hp > 0) { ev(s, { k: 'crack', id: g.id, x: g.x, y: g.y }); return; }
  g.alive = false;
  if (g.type === 'p') { s.shots++; s.shotsMax++; ev(s, { k: 'bonus', id: g.id, x: g.x, y: g.y }); if (byPuck) { s.puck.vx *= .99; s.puck.vy *= .99; } return; }
  s.pops++; s.shotPops++;
  ev(s, { k: 'pop', id: g.id, x: g.x, y: g.y, n: s.shotPops, t: g.type });
  if (g.type === 'b') s.pending.push({ due: s.t + .14, x: g.x, y: g.y, r: 74 });
  if (byPuck) {
    const p = s.puck;
    p.vx *= .985; p.vy *= .985;
    if (p.bomb) { p.bomb = false; blast(s, g.x, g.y, 84); }
  }
}

// Hareketli hedefler ve engellerin o anki konumu (zamanın saf fonksiyonu)
function updateDyn(s) {
  const t = s.t;
  for (const g of s.targets) {
    if (g.alive && (g.ax || g.ay)) {
      g.x = g.x0 + g.ax * Math.sin(t * g.sp + g.ph);
      g.y = g.y0 + g.ay * Math.cos(t * g.sp + g.ph);
    }
  }
  for (const o of s.obst) {
    if (o.gate) o.off = !(((t + o.gate.ph) % o.gate.per) < o.gate.on);
    if (o.k === 'bar') o.a = (o.a0 || 0) + o.w * t;
    else if (o.ax || o.ay) {
      const a = t * (o.sp || 1) + (o.ph || 0);
      o.x = o.x0 + (o.ax || 0) * Math.sin(a);
      o.y = o.y0 + (o.ay || 0) * Math.sin(a);
      o.vx = (o.ax || 0) * (o.sp || 1) * Math.cos(a);
      o.vy = (o.ay || 0) * (o.sp || 1) * Math.cos(a);
    }
  }
}

function stepSim(s, dt) {
  s.t += dt;
  for (const g of s.targets) if (g.cd > 0) g.cd -= dt;
  updateDyn(s);
  if (s.pending.length) {
    for (let i = s.pending.length - 1; i >= 0; i--) {
      const q = s.pending[i];
      if (s.t >= q.due) { s.pending.splice(i, 1); blast(s, q.x, q.y, q.r); }
    }
  }
  const p = s.puck;
  if (!p.moving) return;
  stepPuck(s, p, dt);
  if (!p.moving) { p.bomb = false; p.magnet = false; ev(s, { k: 'stop', x: p.x, y: p.y }); return; }
  for (const g of s.targets) {
    if (!g.alive || g.cd > 0) continue;
    if (Math.hypot(g.x - p.x, g.y - p.y) < p.r + g.r * .85) hitTarget(s, g, 1, true);
  }
}

function fire(s, vx, vy) {
  const p = s.puck;
  p.vx = vx; p.vy = vy; p.moving = true; p.boostId = -1;
  // Portalın üstünde duruyorsa hemen ışınlanmasın
  for (const z of s.zones) if (z.k === 'portal' && Math.hypot(p.x - z.x, p.y - z.y) < PORTAL_R + 4) p.pcd = PORTAL_CD;
  s.shots--; s.used++; s.shotPops = 0;
  ev(s, { k: 'fire', x: p.x, y: p.y, vx, vy });
}

const aliveCount = s => s.targets.reduce((n, g) => n + (g.alive && g.type !== 'p' ? 1 : 0), 0);

// Bir bölümde hangi öğeler var? (eğitim kartları ve üretici bunu kullanır)
function featuresOf(lv) {
  const f = new Set();
  for (const g of lv.targets) {
    if (g.t === 'a') f.add('armored'); if (g.t === 'g') f.add('gold'); if (g.t === 'b') f.add('bomb'); if (g.t === 'p') f.add('bonus');
    if (g.ax || g.ay) f.add('mtarget');
  }
  for (const o of lv.obst || []) {
    if (o.k === 'c') f.add(o.ax || o.ay ? 'mbump' : 'bumper');
    else if (o.k === 'bar') f.add('bar');
    else if (o.brk) f.add('brk'); else if (o.gate) f.add('gate'); else if (o.ax || o.ay) f.add('mwall'); else f.add('wall');
  }
  for (const z of lv.zones || []) f.add(z.k === 'well' && z.s < 0 ? 'rep' : z.k);
  return [...f];
}

const reqCount = lv => lv.targets.reduce((n, g) => n + (g.t === 'p' ? 0 : 1), 0);

// Zincir: kaynak → (pan) → bus → [kuru + reverb] → master → kompresör → hoparlör
const A = {
  ac: null, master: null, comp: null, sfx: null, mus: null, rev: null, revIn: null, noise: null,
  sfxOn: true, musOn: true, ready: false, lastMud: 0, lastStretch: 0, hidden: false
};

function initAudio() {
  if (A.ac) { if (A.ac.state === 'suspended') A.ac.resume(); return; }
  try {
    const ac = A.ac = new (window.AudioContext || window.webkitAudioContext)();
    A.comp = ac.createDynamicsCompressor();
    A.comp.threshold.value = -14; A.comp.knee.value = 18; A.comp.ratio.value = 5; A.comp.attack.value = .004; A.comp.release.value = .2;
    A.master = ac.createGain(); A.master.gain.value = .9;
    A.master.connect(A.comp); A.comp.connect(ac.destination);
    A.sfx = ac.createGain(); A.sfx.gain.value = 1; A.sfx.connect(A.master);
    A.mus = ac.createGain(); A.mus.gain.value = .55; A.mus.connect(A.master);
    // Reverb: sentetik dürtü yanıtı
    A.revIn = ac.createGain(); A.revIn.gain.value = 1;
    A.rev = ac.createConvolver();
    const len = Math.floor(ac.sampleRate * 1.9), imp = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = imp.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * (i < 300 ? i / 300 : 1);
    }
    A.rev.buffer = imp;
    const revOut = ac.createGain(); revOut.gain.value = .42;
    A.revIn.connect(A.rev); A.rev.connect(revOut); revOut.connect(A.master);
    // Beyaz gürültü tamponu
    A.noise = ac.createBuffer(1, ac.sampleRate * 1.2, ac.sampleRate);
    const nd = A.noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    A.ready = true;
    document.addEventListener('visibilitychange', () => {
      A.hidden = document.hidden;
      if (!A.ac) return;
      if (document.hidden) A.ac.suspend(); else A.ac.resume();
    });
    if (A.musOn && Music.want != null) Music.start(Music.want);
  } catch (e) { A.ac = null; A.ready = false; }
}

function audioOn(bus) { return A.ready && (bus === 'mus' ? A.musOn : A.sfxOn); }
function setSfx(on) { A.sfxOn = on; }
function setMusic(on) {
  A.musOn = on;
  if (!A.ready) return;
  if (on) Music.start(Music.want == null ? -1 : Music.want); else Music.stop(true);
}

// Temel osilatör sesi. o: {type, vol, slide, delay, pan, bus, rev, atk, lp, hp, det}
function tone(f, dur, o) {
  o = o || {};
  const bus = o.bus || 'sfx';
  if (!audioOn(bus)) return;
  const ac = A.ac, t = ac.currentTime + (o.delay || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
  if (o.det) osc.detune.value = o.det;
  const atk = o.atk || .006;
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(o.vol == null ? .1 : o.vol, t + atk);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = osc;
  osc.connect(g); node = g;
  if (o.lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; node.connect(fl); node = fl; }
  if (o.hp) { const fl = ac.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = o.hp; node.connect(fl); node = fl; }
  route(node, o, bus);
  osc.start(t); osc.stop(t + dur + .05);
}

function route(node, o, bus) {
  const ac = A.ac;
  if (o.pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); node.connect(p); node = p; }
  node.connect(bus === 'mus' ? A.mus : A.sfx);
  if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; node.connect(s); s.connect(A.revIn); }
}

// Süzgeçli gürültü patlaması
function noiseBurst(dur, f0, f1, vol, o) {
  o = o || {};
  const bus = o.bus || 'sfx';
  if (!audioOn(bus)) return;
  const ac = A.ac, t = ac.currentTime + (o.delay || 0);
  const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = A.noise;
  src.loop = true;
  fl.type = o.type || 'bandpass';
  fl.frequency.setValueAtTime(f0, t);
  fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  fl.Q.value = o.q == null ? 1.2 : o.q;
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (o.atk || .004));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(fl); fl.connect(g);
  route(g, o, bus);
  src.start(t, Math.random() * .5); src.stop(t + dur + .05);
}

// FM çan sesi: cam / buz hissi
function bell(f, vol, o) {
  o = o || {};
  const bus = o.bus || 'sfx';
  if (!audioOn(bus)) return;
  const ac = A.ac, t = ac.currentTime + (o.delay || 0), dur = o.dur || .9;
  const car = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
  car.type = 'sine'; car.frequency.value = f;
  mod.type = 'sine'; mod.frequency.value = f * (o.ratio || 3.5);
  mg.gain.setValueAtTime(f * (o.idx || 1.8), t);
  mg.gain.exponentialRampToValueAtTime(.01, t + dur * .55);
  mod.connect(mg); mg.connect(car.frequency);
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + .004);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  car.connect(g);
  route(g, o, bus);
  car.start(t); mod.start(t); car.stop(t + dur + .05); mod.stop(t + dur + .05);
}

// ------------------------------------------------ MÜZİK (üretken, dünya başına bir tema)
// Her tema: bpm, kök nota (MIDI), akor dizisi ve enstrüman ayarları.
const MUSIC_THEMES = {
  '-1': { name: 'menü',    bpm: 82, root: 57, minor: false, prog: [0, 5, 3, 4],  arp: 'bell',  pad: 'soft',   perc: 0 },
  '0':  { name: 'buz',     bpm: 100, root: 60, minor: false, prog: [0, 4, 5, 3],  arp: 'bell',  pad: 'soft',   perc: 1 },
  '1':  { name: 'neon',    bpm: 112, root: 57, minor: true,  prog: [0, 5, 3, 4],  arp: 'pluck', pad: 'saw',    perc: 2 },
  '2':  { name: 'günbatımı', bpm: 92, root: 62, minor: false, prog: [0, 3, 4, 5], arp: 'pluck', pad: 'warm',   perc: 1 },
  '3':  { name: 'aurora',  bpm: 78, root: 55, minor: true,  prog: [0, 3, 5, 4],  arp: 'bell',  pad: 'airy',   perc: 0 }
};
// Majör/minör diziyi akor köklerine çevir (derece → yarım ton)
const MAJ = [0, 2, 4, 5, 7, 9, 11], MIN = [0, 2, 3, 5, 7, 8, 10];

const Music = {
  want: null, theme: null, key: null, step: 0, next: 0, timer: null, bar: 0, rnd: null, out: null,
  start(key) {
    this.want = key;
    if (!A.ready || !A.musOn) return;
    if (this.key === key && this.timer) return;
    this.stop(false);
    this.key = key;
    this.theme = MUSIC_THEMES[String(key)] || MUSIC_THEMES['-1'];
    this.step = 0; this.bar = 0;
    this.rnd = rng(100 + (key + 2) * 977);
    this.out = A.ac.createGain();
    this.out.gain.setValueAtTime(.0001, A.ac.currentTime);
    this.out.gain.linearRampToValueAtTime(1, A.ac.currentTime + 1.4);
    this.out.connect(A.mus);
    this.next = A.ac.currentTime + .08;
    this.timer = setInterval(() => this.tick(), 28);
  },
  stop(fast) {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.out) {
      const o = this.out, t = A.ac ? A.ac.currentTime : 0;
      try { o.gain.cancelScheduledValues(t); o.gain.setValueAtTime(o.gain.value, t); o.gain.linearRampToValueAtTime(.0001, t + (fast ? .2 : .8)); } catch (e) {}
      setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 1200);
      this.out = null;
    }
    this.key = null;
  },
  duck(on) {
    if (!A.ready) return;
    A.master.gain.cancelScheduledValues(A.ac.currentTime);
    A.master.gain.setTargetAtTime(on ? 0 : .9, A.ac.currentTime, .06);
  },
  chordNotes(bar) {
    const th = this.theme, scale = th.minor ? MIN : MAJ, deg = th.prog[bar % th.prog.length];
    const r = th.root + scale[deg % 7];
    // üçlü: dizideki 1-3-5. derecelerden
    const t3 = scale[(deg + 2) % 7] + (deg + 2 >= 7 ? 12 : 0) - scale[deg % 7];
    const t5 = scale[(deg + 4) % 7] + (deg + 4 >= 7 ? 12 : 0) - scale[deg % 7];
    return [r, r + t3, r + t5, r + 12];
  },
  tick() {
    if (!A.ready || !this.out) return;
    const sp16 = 60 / this.theme.bpm / 4;
    while (this.next < A.ac.currentTime + .16) {
      this.play(this.step % 16, this.next, sp16);
      this.next += sp16;
      this.step++;
      if (this.step % 16 === 0) this.bar++;
    }
  },
  play(s, t, sp) {
    const th = this.theme, ch = this.chordNotes(this.bar), ac = A.ac, d = t - ac.currentTime;
    const o = { bus: 'mus', delay: Math.max(0, d) };
    // Pad: her ölçüde bir, uzun
    if (s === 0) {
      const dur = sp * 16 * 1.05;
      ch.slice(0, 3).forEach((m, i) => {
        const ty = th.pad === 'saw' ? 'sawtooth' : th.pad === 'airy' ? 'sine' : 'triangle';
        tone(mtof(m), dur, Object.assign({ type: ty, vol: th.pad === 'saw' ? .018 : .028, atk: dur * .35, lp: th.pad === 'saw' ? 1100 : 1800, det: i * 5 - 5, rev: .7 }, o));
        tone(mtof(m + 12), dur, Object.assign({ type: 'sine', vol: .012, atk: dur * .4, rev: .8, det: 4 }, o));
      });
    }
    // Bas
    if (s === 0 || s === 10 || (th.perc === 2 && (s === 6 || s === 14))) {
      tone(mtof(ch[0] - 24), sp * (s === 0 ? 5 : 3), Object.assign({ type: th.perc === 2 ? 'sawtooth' : 'triangle', vol: s === 0 ? .075 : .05, lp: 380, atk: .01 }, o));
    }
    // Arp / melodi
    const arpPat = [0, 1, 2, 3, 2, 1, 2, 3];
    if (s % 2 === 0 && (th.perc > 0 || s % 4 === 0)) {
      const idx = arpPat[(s / 2 + this.bar) % 8];
      const m = ch[idx % 4] + 12 + ((s % 8 === 6) ? 12 : 0);
      if (th.arp === 'bell') bell(mtof(m), .03, Object.assign({ dur: .9, rev: .8, ratio: 3.01, idx: 1.2 }, o));
      else tone(mtof(m), .22, Object.assign({ type: 'square', vol: .016, lp: 2200, slide: mtof(m) * .985, rev: .5 }, o));
    }
    // Ara sıra rastgele ışıltı notası
    if (s % 4 === 3 && this.rnd() < .22) {
      const sc = th.minor ? MIN : MAJ, m = th.root + 24 + sc[Math.floor(this.rnd() * 7)];
      bell(mtof(m), .022, Object.assign({ dur: 1.4, rev: 1, ratio: 3.5 }, o));
    }
    // Perküsyon
    if (th.perc >= 1) {
      if (s === 0 || s === 8) { tone(110, .16, Object.assign({ type: 'sine', vol: .09, slide: 42 }, o)); }
      if (s === 4 || s === 12) { noiseBurst(.09, 3500, 1800, .02, Object.assign({ type: 'bandpass', q: .9 }, { bus: 'mus', delay: o.delay })); }
      if (th.perc === 2 && s % 2 === 1) noiseBurst(.03, 8000, 6000, .012, { type: 'highpass', bus: 'mus', delay: o.delay });
      if (th.perc === 1 && (s === 2 || s === 10)) noiseBurst(.03, 8000, 6000, .01, { type: 'highpass', bus: 'mus', delay: o.delay });
    }
  }
};

function setLang(id, silent) {
  if (!LANGS.some(l => l.id === id)) id = 'tr';
  LANG = id;
  if (typeof S !== 'undefined') { S.set.lang = id; if (!silent) store(); }
  document.documentElement.lang = id;
}

// ---------------- Titreşim (Capacitor Haptics varsa onu, yoksa navigator.vibrate)
let lastVib = 0;
const Haptic = {
  _c: undefined,
  cap() {
    if (this._c !== undefined) return this._c;
    const c = window.Capacitor; let h = null;
    try {
      if (c && c.isNativePlatform && c.isNativePlatform()) h = (c.Plugins && c.Plugins.Haptics) || (c.registerPlugin && c.registerPlugin('Haptics'));
    } catch (e) { h = null; }
    return (this._c = h || null);
  },
  vib(ms) {
    if (!S.set.vib) return;
    const n = performance.now();
    if (n - lastVib < 60) return;
    lastVib = n;
    const h = this.cap();
    try {
      if (h && h.impact) h.impact({ style: ms > 22 ? 'HEAVY' : ms > 11 ? 'MEDIUM' : 'LIGHT' });
      else if (navigator.vibrate) navigator.vibrate(ms);
    } catch (e) {}
  },
  ok() { if (!S.set.vib) return; const h = this.cap(); try { if (h && h.notification) h.notification({ type: 'SUCCESS' }); else if (navigator.vibrate) navigator.vibrate([14, 40, 22]); } catch (e) {} }
};
const vib = ms => Haptic.vib(ms);

//  REKLAM SERVİSİ
//  Üç sağlayıcı, hepsi aynı arayüz:
//   · 'admob' → Capacitor + AdMob (iOS/Android uygulaması için; gerçek para burada)
//   · 'h5'    → Google H5 Games Ads (oyunu web sitesinde/portalda yayınlarsan)
//   · 'sim'   → Tarayıcıda test için sahte reklam ekranı
//  Oyun kodu sadece AdService.rewarded() / AdService.interstitial() çağırır.
// ================================================================
const ADCFG = {
  testing: true,            // YAYINA ÇIKARKEN false YAP + aşağıdaki kimlikleri kendi AdMob kimliklerinle değiştir
  android: {
    appId: 'ca-app-pub-3940256099942544~3347511713',          // Google test uygulama kimliği
    rewarded: 'ca-app-pub-3940256099942544/5224354917',       // Google test ödüllü
    interstitial: 'ca-app-pub-3940256099942544/1033173712'    // Google test geçiş
  },
  ios: {
    appId: 'ca-app-pub-3940256099942544~1458002511',
    rewarded: 'ca-app-pub-3940256099942544/1712485313',
    interstitial: 'ca-app-pub-3940256099942544/4411468910'
  },
  interstitialEvery: 3,     // her 3 bölüm kazanışında bir geçiş reklamı
  firstInterstitialLevel: 4, // 4. bölümden önce hiç gösterme (ilk deneyim temiz kalsın)
  interstitialCooldownSec: 150
};

// Eklenti sürümüne göre olay adları değişebiliyor: her olay için birkaç adı birden dinle
const EV = {
  rwReward: ['onRewardedVideoAdReward', 'rewardedVideoAdReward'],
  rwDismiss: ['onRewardedVideoAdDismissed', 'rewardedVideoAdDismissed'],
  rwFailShow: ['onRewardedVideoAdFailedToShow', 'rewardedVideoAdFailedToShow'],
  rwFailLoad: ['onRewardedVideoAdFailedToLoad', 'rewardedVideoAdFailedToLoad'],
  inDismiss: ['onInterstitialAdDismissed', 'interstitialAdDismissed'],
  inFailShow: ['onInterstitialAdFailedToShow', 'interstitialAdFailedToShow']
};
async function listenAll(P, names, fn, subs) {
  for (const n of names) { try { subs.push(await P.addListener(n, fn)); } catch (e) {} }
}

const AdService = {
  provider: 'sim', platform: 'web', busy: false, plugin: null, inited: false, simTimer: 0,

  init() {
    if (this.inited) return;
    this.inited = true;
    const cap = window.Capacitor;
    const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
    if (native) {
      this.platform = (cap.getPlatform && cap.getPlatform()) || 'android';
      this.provider = 'admob';
      try {
        // Eklenti JS paketi olmadan da çalışsın diye doğrudan yerel eklentiye bağlanıyoruz
        this.plugin = (cap.Plugins && cap.Plugins.AdMob) || (cap.registerPlugin && cap.registerPlugin('AdMob'));
        const run = async () => {
          try { if (this.platform === 'ios' && this.plugin.requestTrackingAuthorization) await this.plugin.requestTrackingAuthorization(); } catch (e) {}
          try { await this.plugin.initialize({ initializeForTesting: ADCFG.testing }); } catch (e) { console.warn('AdMob init', e); }
          this.preload();
        };
        run();
      } catch (e) { console.warn('AdMob kurulamadı', e); this.plugin = null; }
    } else if (typeof window.adBreak === 'function') {
      this.provider = 'h5';
      try { window.adConfig && window.adConfig({ preloadAdBreaks: 'on', sound: 'on' }); } catch (e) {}
    } else {
      this.provider = 'sim';
    }
  },
  ids() { return ADCFG[this.platform === 'ios' ? 'ios' : 'android']; },
  label() { return this.provider === 'admob' ? 'AdMob (' + this.platform + (ADCFG.testing ? ', test' : '') + ')' : this.provider === 'h5' ? 'Google H5 Games Ads' : t('ad_sim'); },
  preload() {
    if (this.provider !== 'admob' || !this.plugin) return;
    // Ödüllü reklamı önceden yükle: butona basınca beklemesin
    try { this.plugin.prepareRewardVideoAd({ adId: this.ids().rewarded, isTesting: ADCFG.testing }).catch(() => {}); } catch (e) {}
  },

  // Ödüllü reklam: reklamın sonuna kadar izlenirse onReward çağrılır.
  rewarded(placement, onReward, onFail) {
    onFail = onFail || (() => {});
    if (this.busy) return;
    this.busy = true;
    Music.duck(true);
    S.stats.ads++;
    let settled = false;
    const done = (ok, why) => {
      if (settled) return;
      settled = true; this.busy = false; Music.duck(false);
      if (ok) { store(); onReward(); } else onFail(why);
    };
    if (this.provider === 'admob' && this.plugin) this.admobRewarded(done);
    else if (this.provider === 'h5') this.h5Rewarded(done);
    else this.simShow(t('ad_rewarded'), placement, done);
  },
  async admobRewarded(done) {
    const P = this.plugin, subs = [];
    let rewarded = false;
    const cleanup = () => { subs.forEach(h => { try { h && h.remove && h.remove(); } catch (e) {} }); };
    const finish = (why) => { cleanup(); done(rewarded, rewarded ? null : (why || 'closed')); this.preload(); };
    try {
      await listenAll(P, EV.rwReward, () => { rewarded = true; }, subs);
      await listenAll(P, EV.rwDismiss, () => finish(), subs);
      await listenAll(P, EV.rwFailShow, () => finish('fail'), subs);
      await listenAll(P, EV.rwFailLoad, () => finish('noad'), subs);
      await P.prepareRewardVideoAd({ adId: this.ids().rewarded, isTesting: ADCFG.testing });
      await P.showRewardVideoAd();
    } catch (e) { finish('noad'); }
  },
  h5Rewarded(done) {
    let got = false;
    try {
      window.adBreak({
        type: 'reward', name: 'reward',
        beforeReward: show => show(),
        adViewed: () => { got = true; },
        adDismissed: () => { got = false; },
        adBreakDone: () => done(got, got ? null : 'closed')
      });
    } catch (e) { done(false, 'noad'); }
  },

  // Geçiş reklamı: her kazanılan bölümden sonra uygun sıklıkta
  maybeInterstitial(levelIdx, then) {
    const st = S.adState;
    st.winsSince++;
    const now = Date.now();
    const ok = !S.noAds && levelIdx + 1 >= ADCFG.firstInterstitialLevel && st.winsSince >= ADCFG.interstitialEvery &&
      (now - st.lastInter) / 1000 >= ADCFG.interstitialCooldownSec;
    if (!ok) { store(); then(); return; }
    st.winsSince = 0; st.lastInter = now; store();
    this.interstitial(then);
  },
  interstitial(then) {
    if (this.busy) { then(); return; }
    this.busy = true; Music.duck(true);
    let fin = false;
    const done = () => { if (fin) return; fin = true; this.busy = false; Music.duck(false); then(); };
    if (this.provider === 'admob' && this.plugin) {
      (async () => {
        const P = this.plugin, subs = [];
        const cl = () => subs.forEach(h => { try { h && h.remove && h.remove(); } catch (e) {} });
        try {
          await listenAll(P, EV.inDismiss, () => { cl(); done(); }, subs);
          await listenAll(P, EV.inFailShow, () => { cl(); done(); }, subs);
          await P.prepareInterstitial({ adId: this.ids().interstitial, isTesting: ADCFG.testing });
          await P.showInterstitial();
        } catch (e) { cl(); done(); }
      })();
    } else if (this.provider === 'h5') {
      try { window.adBreak({ type: 'next', name: 'level-end', adBreakDone: done }); } catch (e) { done(); }
    } else {
      this.simShow(t('ad_inter'), 'interstitial', () => done(), true);
    }
  },

  // ---------------- Tarayıcı simülasyonu (gerçek reklam yok; akışı test etmek için)
  simShow(title, placement, done, skippable) {
    const el = $('ad'), num = $('adn'), ring = $('adring'), x = $('adx');
    $('adtitle').textContent = title;
    $('adnote').textContent = placement === 'interstitial'
      ? t('ad_note_inter')
      : t('ad_note_reward');
    const total = skippable ? 2 : 3;
    let n = total, closedEarly = false;
    x.classList.remove('on'); el.classList.add('show');
    const C = 2 * Math.PI * 58;
    ring.style.strokeDasharray = C; ring.style.strokeDashoffset = 0;
    const t0 = performance.now();
    const frame = () => {
      const p = clamp((performance.now() - t0) / (total * 1000), 0, 1);
      ring.style.strokeDashoffset = C * p;
      num.textContent = Math.max(0, Math.ceil(total - p * total));
      if (p >= .35) x.classList.add('on');
      if (p < 1 && !closedEarly) this.simTimer = requestAnimationFrame(frame);
      else if (p >= 1) { el.classList.remove('show'); done(true); }
    };
    x.onclick = () => { // erken kapatma: ödül yok
      closedEarly = true; cancelAnimationFrame(this.simTimer); el.classList.remove('show'); done(!!skippable, 'closed');
    };
    frame();
  }
};

const cv = $('c'), ctx = cv.getContext('2d'), stage = $('stage');
const scr = document.createElement('canvas');           // buz çizikleri katmanı
const bgCache = {};
let k = 1, sc = 1;
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,system-ui,sans-serif';
const AIM = [['#16236f', '#fff'], ['#25e8ff', '#2a1480'], ['#5b1d63', '#fff'], ['#0b4f60', '#fff'], ['#4a2bb0', '#fff']];
const MUDC = [['#8e6c49', '#4f3a27'], ['#7a35c9', '#33105c'], ['#a2604a', '#5a2f33'], ['#45787a', '#1d414a'], ['#9a6f3a', '#4f3412']];
const PORTC = [['#25e8ff', '#7a5cff'], ['#ffab3d', '#ff3d8a']];

function rrect(c, x, y, w, h, r) {
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// ---- Işıma sprite önbelleği (ucuz parlama)
const spr = {};
function glow(h, s, l, a) {
  const key = h + '_' + s + '_' + l + '_' + a;
  if (spr[key]) return spr[key];
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(48, 48, 0, 48, 48, 48);
  g.addColorStop(0, `hsla(${h},${s}%,${l}%,${a})`);
  g.addColorStop(1, `hsla(${h},${s}%,${l}%,0)`);
  x.fillStyle = g; x.fillRect(0, 0, 96, 96);
  return spr[key] = c;
}
function drawGlow(x, y, r, h, s, l, a, alpha) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(glow(h, s, l, a), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
const colGlow = {};
function glowCol(col) {
  if (colGlow[col]) return colGlow[col];
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const x = c.getContext('2d'), g = x.createRadialGradient(48, 48, 0, 48, 48, 48);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 96, 96);
  return colGlow[col] = c;
}
function drawGlowCol(x, y, r, col, alpha) { ctx.globalAlpha = alpha; ctx.drawImage(glowCol(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

// ---- Ölçekleme
function resize() {
  const iw = innerWidth, ih = innerHeight;
  k = Math.min(iw / WW, ih / WH);
  stage.style.transform = 'scale(' + k + ')';
  const d = Math.min(devicePixelRatio || 1, quality.dpr);
  sc = k * d;
  cv.width = Math.round(WW * sc); cv.height = Math.round(WH * sc);
  scr.width = cv.width; scr.height = cv.height;
  for (const key in bgCache) delete bgCache[key];
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

function worldBg(w) { return bgCache[w] || (bgCache[w] = buildBg(w)); }

// Dünya arka planı + tribün + bant + buz yüzeyi (önbelleğe alınır)
function buildBg(wi) {
  const W = WORLDS[wi], bg = document.createElement('canvas');
  bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d');
  c.setTransform(sc, 0, 0, sc, 0, 0);
  let g = c.createLinearGradient(0, 0, 0, WH);
  g.addColorStop(0, W.bg[0]); g.addColorStop(.5, W.bg[1]); g.addColorStop(1, W.bg[2]);
  c.fillStyle = g; c.fillRect(0, 0, WW, WH);

  // Tribündeki ışıklar
  const R = rng(11 + wi * 7);
  for (let i = 0; i < 64; i++) {
    const top = R() < .5, x = R() * WW, y = top ? R() * 62 : 612 + R() * 90, h = W.lights[Math.floor(R() * W.lights.length)], r = 3 + R() * 7;
    const gg = c.createRadialGradient(x, y, 0, x, y, r * 2.6);
    gg.addColorStop(0, `hsla(${h},90%,70%,.55)`); gg.addColorStop(1, `hsla(${h},90%,60%,0)`);
    c.fillStyle = gg; c.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  }
  // Neon: perspektif ızgara + siluet
  if (wi === 1) {
    c.save(); c.strokeStyle = 'rgba(255,61,240,.28)'; c.lineWidth = 1;
    for (let i = 0; i < 9; i++) { const y = 616 + Math.pow(i / 8, 1.8) * 84; c.beginPath(); c.moveTo(0, y); c.lineTo(WW, y); c.stroke(); }
    for (let i = -8; i <= 8; i++) { c.beginPath(); c.moveTo(200 + i * 14, 612); c.lineTo(200 + i * 62, 700); c.stroke(); }
    c.strokeStyle = 'rgba(37,232,255,.25)';
    for (let i = 0; i < 9; i++) { const y = 62 - Math.pow(i / 8, 1.8) * 62; c.beginPath(); c.moveTo(0, y); c.lineTo(WW, y); c.stroke(); }
    c.restore();
  }

function previewPath(maxLen, vx, vy) {
  const ps = { obst: sim.obst.map(o => Object.assign({}, o)), zones: sim.zones, noEv: true, events: [], targets: null };
  const p = { x: sim.puck.x, y: sim.puck.y, vx, vy, r: PR, moving: true, bomb: false, magnet: false, pcd: sim.puck.pcd || 0, boostId: -1, mud: false };
  for (const z of sim.zones) if (z.k === 'portal' && Math.hypot(p.x - z.x, p.y - z.y) < PORTAL_R + 4) p.pcd = PORTAL_CD;
  const pts = []; let trav = 0, acc2 = 0, px = p.x, py = p.y, stopped = false;
  for (let i = 0; i < 1400 && trav < maxLen; i++) {
    stepPuck(ps, p, 1 / 120);

    const d = Math.hypot(p.x - px, p.y - py);

// Eğitim kartı açıkken ilgili öğeyi yanıp sönen çerçeveyle işaretler
function featSpots(f) {
  const out = [], T = { armored: 'a', gold: 'g', bomb: 'b', bonus: 'p' };
  if (T[f]) sim.targets.forEach(g => { if (g.alive && g.type === T[f]) out.push({ x: g.x, y: g.y, r: g.r + 9 }); });
  if (f === 'mtarget') sim.targets.forEach(g => { if (g.alive && (g.ax || g.ay)) out.push({ x: g.x, y: g.y, r: g.r + 9 }); });
  for (const o of sim.obst) {
    const mv = !!(o.ax || o.ay);
    if (o.k === 'c' && (f === (mv ? 'mbump' : 'bumper'))) out.push({ x: o.x, y: o.y, r: o.r + 8 });
    else if (o.k === 'bar' && f === 'bar') out.push({ x: o.x, y: o.y, r: o.len / 2 + 8 });
    else if (o.k === 'r') {
      const kind = o.brk ? 'brk' : o.gate ? 'gate' : mv ? 'mwall' : 'wall';
      if (kind === f) out.push({ x: o.x, y: o.y, w: o.w + 14, h: o.h + 14 });

  }
  for (const z of sim.zones) { const k = z.k === 'well' && z.s < 0 ? 'rep' : z.k; if (k === f) out.push({ x: z.x, y: z.y, r: z.r + 6 }); }
  return out;
}

    ctx.font = '900 ' + f.size + 'px ' + FONT; ctx.lineWidth = f.size * .22; ctx.strokeStyle = '#0e1533'; ctx.strokeText(f.txt, 0, 0); ctx.fillStyle = f.col; ctx.fillText(f.txt, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // öğretici ipucu
  if (hintT > 1.2 && phase === 'aim') {
    const t2 = (hintT * 1.1) % 1.6, q = Math.min(t2 / 1.1, 1);
    ctx.globalAlpha = Math.min(1, (hintT - 1.2)); ctx.font = '900 19px ' + FONT; ctx.lineWidth = 5; ctx.strokeStyle = '#0e1533'; ctx.fillStyle = '#fff';
    ctx.strokeText(t('hint_drag'), 200, FY1 - 128); ctx.fillText(t('hint_drag'), 200, FY1 - 128);
    const hy = FY1 - 105 + q * 30; ctx.globalAlpha *= 1 - q * .6; ctx.beginPath(); ctx.arc(200, hy, 11, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#16236f'; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // beyaz parlama
  if (flashA > .01) { ctx.setTransform(sc, 0, 0, sc, 0, 0); ctx.fillStyle = 'rgba(255,255,255,' + flashA + ')'; ctx.fillRect(0, 0, WW, WH); }
}

// ===== 07-game.js =====
// ---------------------------------------------------------------- 7) OYUN ÇEKİRDEĞİ
let quality = { dpr: 2, lowfx: false };
let rt = 0, curWorld = 0, sim = null, phase = 'title', curLv = 0;
let drag = null, armed = { bomb: false, magnet: false, aim: false };
let vox = 0, voy = 0, puckSq = 0, pSpin = 0, shake = 0, zoom = 0, sweep = 0, flashA = 0, hintT = -99, slow = 1;
let parts = [], rings = [], floats = [], glows = [], trail = [];
let tAnim = [], oFx = [], zFx = [];
let winTimer = -1, flyT = 0, introT = 0, bestCombo = 0, mudNext = 0;
let lastPuck = { x: 0, y: 0 };
let tutQueue = [], tutFocus = null;

// ---------- Etki üreticiler
function burst(x, y, n, col, spd, life, sz) {
  if (quality.lowfx) n = Math.ceil(n * .55);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = (.35 + Math.random() * .65) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, dec: 1 / (life * (.6 + Math.random() * .7)), col: Array.isArray(col) ? col[i % col.length] : col, sz: sz * (.5 + Math.random()), rot: Math.random() * TAU, vr: (Math.random() - .5) * 12, k: 'spark', g: 0 });
  }
}
function confetti(x, y, n) {
  const cols = ['#ff4a5e', '#ffc531', '#34e6a0', '#2f9bff', '#c77dff', '#fff'];
  if (quality.lowfx) n = Math.ceil(n * .6);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, s = 220 + Math.random() * 420;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, dec: .38 + Math.random() * .25, col: cols[i % cols.length], sz: 3 + Math.random() * 3.5, rot: Math.random() * TAU, vr: (Math.random() - .5) * 14, k: 'conf', g: 520 });
  }
}
function ringFx(x, y, r0, r1, col, dur, lw) { rings.push({ x, y, r0, r1, col, dur, t: 0, lw: lw || 4 }); }
function floatTxt(x, y, txt, col, size, dur) { floats.push({ x, y, txt, col: col || '#fff', size: size || 20, dur: dur || 1, t: 0 }); }
function glowFx(x, y, big) { glows.push({ x, y, t: 0, dur: big ? .5 : .28, big }); }
function scratch(a, b) {
  const c = scr.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0);
  c.strokeStyle = WORLDS[curWorld].scratch; c.lineWidth = 1.3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
}

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= q.dec * dt; if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += q.g * dt; const f = q.k === 'conf' ? .985 : .96; q.vx *= f; q.vy *= f; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t >= rings[i].dur) rings.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t >= floats[i].dur) floats.splice(i, 1); }
  for (let i = glows.length - 1; i >= 0; i--) { glows[i].t += dt; if (glows[i].t >= glows[i].dur) glows.splice(i, 1); }
  for (const f of oFx) if (f) f.pulse = Math.max(0, f.pulse - dt * 4.5);
  for (const f of zFx) if (f) f.pulse = Math.max(0, f.pulse - dt * 3);
  for (const a of tAnim) if (a) a.pop = Math.max(0, a.pop - dt * 5);
  shake = Math.max(0, shake - dt * 36); zoom *= Math.pow(.0009, dt); flashA = Math.max(0, flashA - dt * 2.4);
  puckSq = Math.max(0, puckSq - dt * 6);
  if (!sim) return;
  const p = sim.puck;
  if (p.moving) {
    const sp = Math.hypot(p.vx, p.vy); pSpin += sp * dt * .02;
    if (trail.length === 0 || Math.hypot(p.x - trail[trail.length - 1].x, p.y - trail[trail.length - 1].y) > 3) {
      if (trail.length) scratch(trail[trail.length - 1], p);
      trail.push({ x: p.x, y: p.y });
    }
    if (trail.length > 24) trail.shift();
    voy = 0; vox = 0;
    if (p.mud && sp > 30) { // çamur sıçraması
      if (rt > mudNext) { mudNext = rt + .045; burst(p.x, p.y, 2, ['#6b4a2b', '#4f3a27', '#8e6c49'], 70, .6, 3.2); }
      SFX.mud();
    }
  } else {
    if (trail.length) trail.splice(0, Math.ceil(trail.length * .15 + 1));
    voy = Math.sin(rt * 2.6) * 1.2; vox = 0;
  }
}

// ---------- Tema uygulama
function applyTheme(w) {
  const W = WORLDS[w];
  document.documentElement.style.setProperty('--acc', W.acc);
  document.documentElement.style.setProperty('--acc2', W.acc2);

  document.querySelector('meta[name=theme-color]').setAttribute('content', W.bg[0]);
}

// ---------- Bölüm başlatma
function startLevel(i, skipIntro) {
  curLv = clamp(i, 0, LEVELS.length - 1);
  S.cur = curLv; store();
  const lv = LEVELS[curLv];
  sim = mkSim(lv);
  curWorld = lv.world;
  applyTheme(curWorld);
  clearScratch(); initAmbient(curWorld);
  parts = []; rings = []; floats = []; glows = []; trail = [];
  tAnim = sim.targets.map((g, n) => ({
    bt: rt + .25 + n * .035, ph: Math.random() * 6.28, pop: 0,
    hue: WORLDS[curWorld].hues[(n * 3 + curLv) % WORLDS[curWorld].hues.length]
  }));
  oFx = sim.obst.map(() => ({ pulse: 0 })); zFx = sim.zones.map(() => ({ pulse: 0 }));
  armed = { bomb: false, magnet: false, aim: false };
  winTimer = -1; slow = 1; zoom = 0; flashA = 0; shake = 0; bestCombo = 0; drag = null; flyT = 0;
  hintT = (curLv === 0 && S.stats.wins === 0) ? 0 : -99;
  tutQueue = []; tutFocus = null;
  if (!skipIntro) tutQueue = tutorialsFor(lv);

  document.body.classList.remove('nohud');
  hideAll();
  setHud(); refreshDock();
