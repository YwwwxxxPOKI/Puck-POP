  phase = 'intro'; introT = 0;
  showIntro(lv);
}

function retryLevel() { SFX.swoosh(); startLevel(curLv, true); }

// ---------- Atış ve olaylar
function doFire(vx, vy) {
  const p = sim.puck;
  p.bomb = armed.bomb; p.magnet = armed.magnet;
  if (armed.bomb) S.pu.bomb = Math.max(0, S.pu.bomb - 1);
  if (armed.magnet) S.pu.magnet = Math.max(0, S.pu.magnet - 1);
  if (armed.aim) S.pu.aim = Math.max(0, S.pu.aim - 1);
  lastPuck = { x: p.x, y: p.y };
  fire(sim, vx, vy);
  S.stats.shots++; store();
  phase = 'fly'; flyT = 0; hintT = -99;
  setHud(); refreshDock();
}

function handleEvents() {
  const evs = sim.events; sim.events = [];
  for (const e of evs) {
    switch (e.k) {
      case 'fire': {
        const pw = Math.hypot(e.vx, e.vy) / VMAX;
        SFX.fire(pw); vib(10 + pw * 14); puckSq = 1; zoom = .0; shake = Math.max(shake, pw * 3);
        ringFx(e.x, e.y, 10, 38, 'rgba(255,255,255,.9)', .35, 3);
        burst(e.x, e.y, 10, ['#fff', WORLDS[curWorld].trail], 150, .5, 2.6);
        break;
      }
      case 'wall': {
        SFX.wall(e.s, e.x); vib(e.s > 500 ? 12 : 6); puckSq = Math.min(1, e.s / 900);
        glowFx(e.x, e.y, false); burst(e.x, e.y, Math.min(10, 3 + e.s / 160), ['#fff', WORLDS[curWorld].trail], 110 + e.s * .1, .45, 2.4);
        shake = Math.max(shake, Math.min(3, e.s / 450));
        break;
      }
      case 'obst': {
        const f = oFx[e.id]; if (f) f.pulse = 1;
        if (e.o === 'c') { SFX.bump(e.x); vib(14); ringFx(e.x, e.y, 10, 44, '#ff8a9a', .35, 3.4); burst(e.x, e.y, 8, ['#ff6b7c', '#fff'], 190, .5, 3); }
        else { SFX.wall(e.s, e.x); burst(e.x, e.y, 5, ['#fff', WORLDS[curWorld].trail], 120, .4, 2.4); }
        puckSq = Math.min(1, e.s / 900);
        break;
      }
      case 'pop': {
        const g = sim.targets[e.id], a = tAnim[e.id];
        const hue = e.t === 'g' ? 46 : e.t === 'a' ? 215 : e.t === 'b' ? 352 : a.hue;
        const cols = ['hsl(' + hue + ',95%,62%)', 'hsl(' + hue + ',100%,82%)', '#fff'];
        burst(e.x, e.y, 20, cols, 270, .75, 3.6);
        ringFx(e.x, e.y, 6, 52 + Math.min(e.n, 6) * 4, 'hsl(' + hue + ',100%,78%)', .5, 4.4);
        glowFx(e.x, e.y, false);
        SFX.pop(e.n, e.x); vib(14);
        if (e.n >= 2) { floatTxt(e.x, e.y - 18, 'x' + e.n, e.n >= 4 ? '#ffc531' : '#fff', 18 + Math.min(e.n, 8) * 2.2, .9); SFX.combo(e.n); }
        if (e.n > bestCombo) bestCombo = e.n;
        if (e.t === 'g') goldBonus(e.x, e.y);
        if (aliveCount(sim) === 0 && phase === 'fly') {
          phase = 'clear'; winTimer = 1.15; slow = .32; zoom = .035; flashA = .35;
          ringFx(e.x, e.y, 10, 240, '#fff', .8, 6); burst(e.x, e.y, 36, ['#fff', '#ffc531'], 400, 1, 4); confetti(e.x, e.y, 36);
        }
        break;
      }
      case 'brk': SFX.brk(e.x); vib(12); { const f = oFx[e.id]; if (f) f.pulse = 1; } burst(e.x, e.y, 8, ['#d8e6ff', '#8aa5e6', '#fff'], 170, .5, 2.8); shake = Math.max(shake, 2); break;
      case 'brkdie': SFX.brkdie(e.x); vib(24); shake = Math.max(shake, 6); burst(e.x, e.y, 30, ['#d8e6ff', '#8aa5e6', '#fff', '#5b78c8'], 330, .8, 4.2); ringFx(e.x, e.y, 8, 70, '#d8e6ff', .5, 4); break;
      case 'bonus':
        SFX.bonus(e.x); Haptic.ok(); burst(e.x, e.y, 18, ['#2fe39a', '#d8ffee', '#fff'], 250, .7, 3.4); ringFx(e.x, e.y, 6, 60, '#7dffc4', .55, 4.4);
        floatTxt(e.x, e.y - 20, t('plus_move'), '#7dffc4', 18, 1.3); setHud(true); break;
      case 'crack': SFX.crack(e.x); vib(10); burst(e.x, e.y, 9, ['#dfe8f5', '#9fb2c8'], 150, .5, 2.8); if (tAnim[e.id]) tAnim[e.id].pop = 1; break;
      case 'blast':
        SFX.blast(); vib(30); shake = Math.max(shake, 11); flashA = Math.max(flashA, .55); zoom = .02;
        ringFx(e.x, e.y, 6, e.r + 12, '#ffcf6a', .55, 7); ringFx(e.x, e.y, 6, e.r * .7, '#fff', .38, 4);
        glows.push({ x: e.x, y: e.y, t: 0, dur: .6, big: true });
        burst(e.x, e.y, 46, ['#ff4d5e', '#ffb347', '#fff', '#ffe36a'], 460, .85, 4.4);
        break;
      case 'portal':
        SFX.portal(e.x); vib(18);
        ringFx(e.x, e.y, 6, 50, PORTC[e.ch % 2][0], .45, 4); ringFx(e.x2, e.y2, 6, 54, PORTC[e.ch % 2][1], .5, 4);
        burst(e.x, e.y, 12, [PORTC[e.ch % 2][0], '#fff'], 180, .5, 2.8); burst(e.x2, e.y2, 16, [PORTC[e.ch % 2][1], '#fff'], 220, .55, 3);
        sim.zones.forEach(z => { if (z.k === 'portal' && z.ch === e.ch && zFx[z.id]) zFx[z.id].pulse = 1; });
        trail = []; flashA = Math.max(flashA, .1);
        break;
      case 'boost':
        SFX.boost(); vib(16); if (zFx[e.id]) zFx[e.id].pulse = 1;
        ringFx(e.x, e.y, 6, 44, '#9bffd0', .4, 3.4); burst(e.x, e.y, 12, ['#9bffd0', '#fff'], 260, .45, 3);
        break;
    }
  }
}

function goldBonus(x, y) {
  SFX.gold(); Haptic.ok();
  const keys = PU_KEYS, key = keys[(S.stats.pops + curLv) % keys.length];
  S.pu[key]++; S.coins += 8; store();
  floatTxt(x, y - 34, '+1 ' + puName(key), PUS[key].col, 17, 1.5);
  floatTxt(x, y - 10, '+8', '#ffc531', 16, 1.2);
  refreshDock(); setCoins(true);
}

// ---------- Kazanma / kaybetme
function tierOf(i) { return TIERS[LEVELS[i].tier]; }
function starsFor(used, lv) {
  return used <= lv.par ? 3 : used <= lv.par + 1 ? 2 : 1;
}
function startWin() {
  if (phase === 'win') return;
  phase = 'win'; slow = 1; zoom = 0;
  const lv = LEVELS[curLv], used = sim.used, st = starsFor(used, lv), left = sim.shots;
  const first = !(S.stars[curLv] > 0);
  const base = 12 + lv.tier * 6, earn = base + left * 4 + st * 6 + (first ? 10 : 0);
  const prev = S.stars[curLv] || 0, rec = st > prev;
  S.stars[curLv] = Math.max(prev, st);
  S.unlocked = Math.max(S.unlocked, Math.min(LEVELS.length, curLv + 2));
  S.coins += earn; S.stats.wins++; S.stats.pops += sim.pops;
  store();
  const last = curLv === LEVELS.length - 1;
  SFX.win(); Haptic.ok();
  setTimeout(() => { if (phase === 'win') showWin({ st, earn, used, par: lv.par, rec: rec && prev > 0, last, tier: lv.tier, combo: bestCombo }); }, 80);
}
function startLose() {
  if (phase === 'lose') return;
  phase = 'lose'; SFX.lose(); vib(26);
  setTimeout(() => { if (phase === 'lose') showLose(); }, 450);
}

// ---------- Ana döngü
let last = performance.now(), fpsN = 0, fpsSum = 0, fpsDone = false, acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  if (dt > .1) dt = .1; if (dt <= 0) return;
  if (!fpsDone && phase !== 'map' && phase !== 'pause') {
    fpsSum += dt; fpsN++;
    if (fpsN >= 150) {
      fpsDone = true;
      const avg = fpsSum / fpsN;
      if (avg > .026) { quality.dpr = Math.min(quality.dpr, 1.5); quality.lowfx = true; document.body.classList.add('lowfx'); resize(); initAmbient(curWorld); }
    }
  }
  if (phase === 'pause' || document.hidden) return;
  rt += dt; sweep += dt;
  if (phase === 'map') return;
  if (hintT > -50) hintT += dt;
  if (sim) {
    acc += dt * slow;
    const h = sim.puck.moving || sim.pending.length ? STEP : 1 / 60;
    let n = 0;
    while (acc >= h && n < 40) { stepSim(sim, h); acc -= h; n++; }
    if (n >= 40) acc = 0;
    handleEvents();
    if (phase === 'fly') {
      flyT += dt;
      if (flyT > 18 && sim.puck.moving) { sim.puck.moving = false; sim.puck.vx = sim.puck.vy = 0; }
      if (!sim.puck.moving && sim.pending.length === 0) {
        const alive = aliveCount(sim);
        if (alive === 0) startWin();
        else if (sim.shots <= 0) startLose();
        else { phase = 'aim'; armed.bomb = armed.magnet = armed.aim = false; refreshDock(); setHud(); }
      }
    } else if (phase === 'clear') {
      winTimer -= dt;
      slow = lerp(slow, 1, dt * 1.5);
      if (winTimer <= 0) startWin();
    } else if (phase === 'intro') {
      introT += dt;
    }
  }
  updateFx(dt);
  updateAmbient(dt, curWorld);
  drawFrame();
}

// ---------- Giriş (sürükle-bırak)
function ptrPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * WW, y: (e.clientY - r.top) / r.height * WH }; }
stage.addEventListener('pointerdown', e => {
  initAudio(); AdService.init();
  if (e.target !== cv) return;
  if (phase === 'intro') { if (introT > .5) endIntro(); return; }
  if (phase !== 'aim' || !sim || sim.shots <= 0 || sim.puck.moving) return;
  const p = ptrPos(e);
  drag = { sx: p.x, sy: p.y, ox: 0, oy: 0, id: e.pointerId };
  try { stage.setPointerCapture(e.pointerId); } catch (er) {}
  hintT = -99;
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = ptrPos(e);
  let dx = p.x - drag.sx, dy = p.y - drag.sy;
  const l = Math.hypot(dx, dy);
  if (l > PULL) { dx *= PULL / l; dy *= PULL / l; }
  drag.ox = dx; drag.oy = dy;
  SFX.stretch(Math.hypot(dx, dy) / PULL);
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  const pw = Math.hypot(d.ox, d.oy) / PULL;
  if (cancel || pw < .12 || phase !== 'aim') { if (pw >= .12 && !cancel) return; if (pw > .05) SFX.back(); return; }
  doFire(-d.ox / PULL * VMAX, -d.oy / PULL * VMAX);
}
stage.addEventListener('pointerup', e => endDrag(e, false));
stage.addEventListener('pointercancel', e => endDrag(e, true));
addEventListener('blur', () => { if (drag) { drag = null; } if (phase === 'aim' || phase === 'fly') { /* arkaya gidince duraklat */ } });
document.addEventListener('visibilitychange', () => { if (document.hidden && (phase === 'aim' || phase === 'fly')) pauseGame(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (phase === 'aim' || phase === 'fly') pauseGame(); else if (phase === 'pause') resumeGame(); else if (phase === 'tut') closeTut(); }
  if (e.key === 'r' && (phase === 'aim' || phase === 'fly')) retryLevel();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- Güçlendiriciler
function usePU(key) {
  if (phase !== 'aim' || sim.puck.moving) return;
  if (S.pu[key] <= 0) {
    offerAd({ icon: PUS[key].svg, col: PUS[key].col, title: t('pu_empty', puName(key)), desc: t('pu_empty_desc', puName(key)), cta: t('watch_ad'), placement: 'pu_' + key,
      onReward() { S.pu[key]++; store(); SFX.reward(); refreshDock(); toast('+1 ' + puName(key)); } });
    return;
  }
  if (key === 'extra') {
    S.pu.extra--; sim.shots++; sim.shotsMax++; store();
    SFX.powerup(); vib(18); ringFx(sim.puck.x, sim.puck.y, 8, 70, PUS.extra.col, .5, 4); floatTxt(sim.puck.x, sim.puck.y - 36, t('plus_move'), PUS.extra.col, 18, 1.1);
    setHud(true); refreshDock(); return;
  }
  armed[key] = !armed[key];
  if (armed[key]) { SFX.powerup(); vib(12); if (key === 'bomb') armed.magnet = false; if (key === 'magnet') armed.bomb = false; } else SFX.back();
  refreshDock();
}

// ---------- Duraklat
function pauseGame() { if (phase !== 'aim' && phase !== 'fly') return; prevPhase = phase; phase = 'pause'; drag = null; showPause(); }
let prevPhase = 'aim';
function resumeGame() { hideScr('pause'); phase = prevPhase; last = performance.now(); }

// ---------- Hata ayıklama / test kancası
window.PP = {
  get S() { return S; }, get sim() { return sim; }, get phase() { return phase; }, get curLv() { return curLv; },
  startLevel, doFire, LEVELS, mkSim, stepSim, fire, aliveCount, retryLevel, get tutQueue() { return tutQueue; }, closeTut() { closeTut(); },
  skipIntro() { if (phase === 'intro') endIntro(); },
  openMap() { openMap(); }, showTitle() { showTitle(); },
  setPhase(p) { phase = p; }, winNow() { startWin(); }, loseNow() { startLose(); }
};

// ===== 08-ui.js =====
// ---------------------------------------------------------------- 8) ARAYÜZ: HUD · HARİTA · EKRANLAR
const SCREENS = ['title', 'map', 'intro', 'tut', 'win', 'lose', 'pause', 'shop', 'settings', 'daily', 'offer', 'guide'];
const starSVG = (on, cls) => '<svg viewBox="0 0 24 24" class="' + (cls || '') + (on ? '' : ' off') + '"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.7 5.7 21.2l1.5-7.1L1.8 9.2l7.2-.8z" fill="#ffc531" stroke="#fff6c9" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const totalStars = () => S.stars.reduce((a, b) => a + (b || 0), 0);

function showScr(id) { const el = $('scr-' + id); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function hideScr(id) { $('scr-' + id).classList.remove('show'); }
function hideAll() { SCREENS.forEach(hideScr); }

let toastT = 0;
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 1800);
}

// ---------------------------------------------------------------- HUD
function setCoins(bump) {
  $('coins').firstElementChild.nextSibling.textContent = S.coins;
  if (bump) { const c = $('coinpill'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
}
function setHud(newShot) {
  const lv = LEVELS[curLv], tr = TIERS[lv.tier];
  $('lvl').textContent = t('level', curLv + 1);
  const chip = $('tierchip'); chip.textContent = tierName(lv.tier); chip.style.setProperty('--c', tr.col); chip.style.setProperty('--g', tr.glow);
  const left = sim ? sim.shots : lv.shots, max = sim ? sim.shotsMax : lv.shots;
  const sh = $('shots');
  if (max <= 9) {
    let h = '';
    for (let i = 0; i < max; i++) h += '<div class="pk' + (i >= left ? ' used' : '') + (newShot && i === max - 1 ? ' new' : '') + '"></div>';
    sh.innerHTML = h;
  } else {
    sh.innerHTML = '<div class="pk"></div><b style="font-size:15px;margin:0 2px 0 3px;line-height:14px">× ' + left + '</b>';
  }
  const tot = reqCount(lv), alive = sim ? aliveCount(sim) : tot;
  $('leftn').textContent = alive + '/' + tot;
  $('leftbar').style.width = ((tot - alive) / tot * 100) + '%';
  setCoins(false);
}
function refreshDock() {
  const dock = $('dock'); let h = '';
  for (const k of PU_KEYS) {
    const n = S.pu[k], P = PUS[k];
    h += '<div class="pu' + (armed[k] ? ' on' : '') + '" data-pu="' + k + '"><div class="btn" style="color:' + P.col + '">' + P.svg +
      (n > 0 ? '<span class="cnt">' + n + '</span>' : '<span class="cnt ad">' + IC.adMini + '</span>') + '</div><small>' + puName(k) + '</small></div>';
  }
  dock.innerHTML = h;
}
$('dock').addEventListener('click', e => {
  const b = e.target.closest('.pu'); if (!b) return;
  initAudio(); usePU(b.dataset.pu);
});

// ---------------------------------------------------------------- BÖLÜM GİRİŞİ
function showIntro(lv) {
  const tr = TIERS[lv.tier], W = WORLDS[lv.world];
  document.body.classList.add('nohud');
  const el = $('scr-intro');
  el.innerHTML = '<div class="intro glass strong" style="--tc:' + tr.col + ';--tg:' + tr.glow + '">' +
    '<div class="wn">' + worldName(lv.world) + ' · ' + (lv.id % 20 + 1) + '/20</div>' +
    '<div class="bn">' + t('level', lv.id + 1) + '</div><div class="ln">' + lvName(lv) + '</div>' +
    '<div class="tb">' + tierName(lv.tier) + '</div>' + (lv.boss ? '<div class="bossb">' + IC.crown + t('boss_level') + '</div>' : '') +
    '<div class="chips"><span class="chip">' + IC.puck + t('moves', lv.shots) + '</span>' +
    '<span class="chip">' + IC.target + t('targets', reqCount(lv)) + '</span>' +
    '<span class="chip">' + IC.starI + ' ' + (S.stars[lv.id] || 0) + '/3</span></div>' +
    '<div class="tip">' + lvTip(lv) + '</div><div class="tap">' + t('tap_start') + '</div></div>';
  showScr('intro'); SFX.intro(lv.tier); SFX.swoosh(); vib(16);
  clearTimeout(showIntro.t); showIntro.t = setTimeout(() => { if (phase === 'intro') endIntro(); }, 3000);

function endIntro() {
  if (phase !== 'intro') return;
  clearTimeout(showIntro.t);
  const c = document.querySelector('#scr-intro .intro'); if (c) c.classList.add('out');
  phase = 'aim'; SFX.swoosh();
  document.body.classList.remove('nohud');
  if (tutQueue.length) setTimeout(() => { if (phase === 'aim' && tutQueue.length) showTut(); }, 380);
  setTimeout(() => { if (phase !== 'intro') hideScr('intro'); }, 380);
}
$('scr-intro').addEventListener('pointerdown', () => { initAudio(); if (introT > .5) endIntro(); });

// ---------------------------------------------------------------- KAZANMA / KAYBETME
function coinSpan() { return '<span class="coin"></span>'; }
function showWin(r) {
  const lv = LEVELS[curLv], tr = TIERS[lv.tier];
  document.body.classList.add('nohud');
  $('scr-win').innerHTML = '<div class="card glass strong" style="--tc:' + tr.col + '">' +
    '<h3>' + (r.last ? t('champion') : t('level_done', lvName(lv))) + '</h3><h2>' + (r.st === 3 ? t('perfect') : r.st === 2 ? t('great') : t('nice')) + '</h2>' +
    '<div class="stars" id="wstars">' + [1, 2, 3].map(i => starSVG(false)).join('') + '</div>' +
    (r.rec ? '<div class="newrec">' + t('new_record') + '</div>' : '') +
    '<div class="earn" id="wearn">' + coinSpan() + '<b id="wearnN">0</b></div>' +
    '<div class="par">' + t('shots_par', r.used, r.par) + (r.combo >= 3 ? t('best_combo', r.combo) : '') + '</div>' +
    '<div class="btns">' +
    (r.last ? '<button class="cta gold" id="w-map">' + IC.trophy + ' ' + t('back_to_map') + '</button>' : '<button class="cta pulse" id="w-next">' + t('next_level') + '</button>') +
    '<button class="cta blue sm" id="w-dbl">' + IC.ad + ' ' + t('double_coins', r.earn) + '</button>' +
    '<div class="row"><button class="cta ghost sm" style="min-width:0;flex:1" id="w-retry">' + IC.redo + ' ' + t('retry') + '</button>' +
    '<button class="cta ghost sm" style="min-width:0;flex:1" id="w-map2">' + IC.map + ' ' + t('map') + '</button></div></div></div>';
  showScr('win');
  // yıldız sırası
  const stars = $('wstars').children;
  for (let i = 0; i < 3; i++) setTimeout(() => {
    if (phase !== 'win') return;
    if (i < r.st) { stars[i].classList.remove('off'); stars[i].classList.add('on'); SFX.star(i); vib(12); }
  }, 420 + i * 330);
  // jeton sayacı
  const target = r.earn, t0 = performance.now();
  (function cnt() {
    const q = clamp((performance.now() - t0 - 300) / 900, 0, 1), el = $('wearnN');
    if (!el) return; el.textContent = Math.round(target * easeOutCubic(q));
    if (q < 1) requestAnimationFrame(cnt); else { setCoins(true); }
  })();
  const go = n => AdService.maybeInterstitial(curLv, n);
  const nxt = $('w-next'); if (nxt) nxt.onclick = () => go(() => startLevel(curLv + 1));
  $('w-retry').onclick = () => go(() => startLevel(curLv, false));
  $('w-map2').onclick = () => go(() => openMap());
  const wm = $('w-map'); if (wm) wm.onclick = () => openMap();
  $('w-dbl').onclick = () => {
    watchAd('win_x2', () => { S.coins += r.earn; store(); SFX.reward(); setCoins(true); const b = $('w-dbl'); if (b) { b.classList.add('off'); b.innerHTML = IC.check + ' ' + t('claimed'); } $('wearnN').textContent = r.earn * 2; toast(t('plus_coins', r.earn)); });
  };
}
function showLose() {
  const lv = LEVELS[curLv], left = aliveCount(sim), tr = TIERS[lv.tier];
  document.body.classList.add('nohud');
  $('scr-lose').innerHTML = '<div class="card glass strong" style="--tc:' + tr.col + '">' +
    '<h3>' + lvName(lv) + '</h3><h2>' + t('out_of_moves') + '</h2>' +
    '<div class="row"><span class="chip">' + IC.target + t('targets_left', left) + '</span><span class="chip">' + IC.puck + ' ' + t('zero_moves') + '</span></div>' +
    '<p>' + t('lose_msg') + '</p>' +
    '<div class="btns"><button class="cta blue pulse" id="l-ad">' + IC.ad + ' ' + t('lose_ad') + '</button>' +
    '<button class="cta" id="l-retry">' + IC.redo + ' ' + t('retry_try') + '</button>' +
    '<button class="cta ghost sm" id="l-map">' + IC.map + ' ' + t('map') + '</button></div></div>';

    hideScr('lose'); sim.shots += 2; sim.shotsMax += 2; phase = 'aim'; document.body.classList.remove('nohud');

}

}

// ---------------------------------------------------------------- AYARLAR
let setFromPause = false;
// Statik (HTML'deki) metinleri ve erişilebilirlik etiketlerini geçerli dile çevir

  const aria = { 'btn-pause': 'a_pause', 'btn-tshop': 'a_shop', 'btn-tset': 'a_settings', 'map-back': 'a_back', 'map-shop': 'a_shop', 'map-set': 'a_settings', 'map-guide': 'a_guide', 'map-cur': 'a_current', 'adx': 'a_close' };
  for (const id in aria) $(id).setAttribute('aria-label', t(aria[id]));
  document.querySelector('#scr-title .tag').textContent = t('tag');
  document.querySelector('#ad .adtag').textContent = t('ad_test');
  document.querySelector('#ad .art').textContent = t('ad_area');
  $('map-cur').innerHTML = IC.locate + '<span>' + t('cur_short') + '</span>';
  $('map-guide').innerHTML = IC.book + '<span>' + t('guide') + '</span>';
}
// Oyun sırasında dil değişince açık olan her şeyi tazele
function changeLang(id) {
  if (id === LANG) return;
  setLang(id); SFX.ui(); vib(10);
  applyStaticLang(); setHud(); refreshDock();
  if (phase === 'title') updateTitleText();
  else if (phase === 'map') { buildMap(); updateMapHead(); }
  else if (phase === 'pause') showPause();
  renderSettings();
}
function renderSettings() {
  const row = (id, ic, label, on) => '<div class="setrow" data-k="' + id + '"><span class="l">' + ic + label + '</span><div class="sw' + (on ? ' on' : '') + '"></div></div>';
  $('scr-settings').innerHTML = '<div class="card glass strong"><button class="xbtn gbtn glass s" id="s-x">' + IC.close + '</button><h2>' + t('settings') + '</h2>' +
    row('sfx', IC.sound, t('set_sfx'), S.set.sfx) + row('music', IC.music, t('set_music'), S.set.music) + row('vib', IC.vibe, t('set_vib'), S.set.vib) +
    '<div class="setrow" style="flex-direction:column;align-items:stretch;gap:9px"><span class="l">' + IC.globe + t('set_lang') + '</span><div class="tabs" id="langtabs">' +
    LANGS.map(l => '<button class="tab' + (LANG === l.id ? ' sel' : '') + '" data-lang="' + l.id + '">' + l.name + '</button>').join('') + '</div></div>' +
    '<div class="setrow" id="s-reset" style="cursor:pointer"><span class="l">' + IC.trash + '<span id="s-reset-t">' + t('reset_progress') + '</span></span></div>' +
    '<div class="ver">Puck Pop 3.0 · ' + t('ad_label', AdService.label()) + '</div></div>';
  $('s-x').onclick = () => hideScr('settings');
  document.querySelectorAll('#scr-settings .setrow[data-k]').forEach(r => r.onclick = () => {
    const k = r.dataset.k; S.set[k] = !S.set[k]; r.querySelector('.sw').classList.toggle('on', S.set[k]); store();
    if (k === 'sfx') setSfx(S.set.sfx); if (k === 'music') setMusic(S.set.music);
    if (k === 'vib' && S.set.vib) vib(20); SFX.tap();
  });
  document.querySelectorAll('#langtabs .tab').forEach(b => b.onclick = () => changeLang(b.dataset.lang));
  let armedReset = false;
  $('s-reset').onclick = () => {
    if (!armedReset) {
      armedReset = true; $('s-reset-t').textContent = t('reset_confirm'); SFX.error();
      setTimeout(() => { armedReset = false; const el = $('s-reset-t'); if (el) el.textContent = t('reset_progress'); }, 3000);
      return;
    }
    const lg = LANG;                                  // dil seçimi sıfırlanmasın
    S = defaultSave(); S.intro = false; S.set.lang = lg; storeNow(); setSfx(true); setMusic(true); hideAll(); toast(t('reset_done')); showTitle();
  };
}
function openSettings(fromPause) {
  setFromPause = !!fromPause;
  renderSettings();
  $('scr-settings').classList.add('z30', 'modal'); showScr('settings');
}

// ---------------------------------------------------------------- MAĞAZA
let shopTab = 'skin';
function openShop(fromMap) {
  const render = () => {
    let grid = '';
    if (shopTab === 'skin') {
      grid = '<div class="shopgrid">' + SKINS.map((s, i) => {
        const own = S.owned.includes(i), sel = S.skin === i;
        return '<button class="item' + (sel ? ' sel' : '') + (!own && S.coins < s.cost ? ' cant' : '') + '" data-skin="' + i + '"><canvas data-sk="' + i + '"></canvas><span>' + skinName(i) + '</span>' +
          (own ? '<span class="own">' + (sel ? t('selected') : t('owned')) + '</span>' : '<span class="pr"><i class="coin"></i>' + s.cost + '</span>') + '</button>';
      }).join('') + '</div>';
    } else {
      grid = '<div class="shopgrid two">' + PU_KEYS.map(k => {
        const P = PUS[k];
        return '<button class="item' + (S.coins < P.cost ? ' cant' : '') + '" data-pu="' + k + '" style="color:' + P.col + '"><span class="cnt2" style="color:#fff">×' + S.pu[k] + '</span><span style="width:36px;height:36px;display:grid;place-items:center">' + P.svg + '</span><span style="color:#fff">' + puName(k) + '</span><span style="color:rgba(255,255,255,.7);font-size:11px;font-weight:700">' + puDesc(k) + '</span><span class="pr"><i class="coin"></i>' + P.cost + '</span></button>';
      }).join('') + '</div>';
    }
    $('scr-shop').innerHTML = '<div class="card glass strong"><button class="xbtn gbtn glass s" id="sh-x">' + IC.close + '</button><h2>' + t('shop') + '</h2>' +
      '<div class="pill glass s" style="height:34px"><span class="coin"></span><b>' + S.coins + '</b></div>' +
      '<div class="tabs"><button class="tab' + (shopTab === 'skin' ? ' sel' : '') + '" data-t="skin">' + t('tab_skins') + '</button><button class="tab' + (shopTab === 'pu' ? ' sel' : '') + '" data-t="pu">' + t('tab_pu') + '</button></div>' +
      grid + '<button class="cta blue sm" id="sh-ad">' + IC.ad + ' ' + t('free_coins') + '</button></div>';
    $('scr-shop').querySelectorAll('canvas[data-sk]').forEach(c => drawSkinPreview(c, +c.dataset.sk));
    $('sh-x').onclick = () => { hideScr('shop'); setCoins(false); };
    $('scr-shop').querySelectorAll('.tab').forEach(t => t.onclick = () => { shopTab = t.dataset.t; render(); });
    $('scr-shop').querySelectorAll('[data-skin]').forEach(b => b.onclick = () => {
      const i = +b.dataset.skin, s = SKINS[i];
      if (S.owned.includes(i)) { S.skin = i; SFX.ui(); }
      else if (S.coins >= s.cost) { S.coins -= s.cost; S.owned.push(i); S.skin = i; SFX.buy(); Haptic.ok(); toast(t('skin_unlocked', skinName(i))); }
      else { SFX.error(); toast(t('no_coins')); return; }
      store(); render();
    });
    $('scr-shop').querySelectorAll('[data-pu]').forEach(b => b.onclick = () => {
      const k = b.dataset.pu, P = PUS[k];
      if (S.coins >= P.cost) { S.coins -= P.cost; S.pu[k]++; SFX.buy(); store(); render(); refreshDock(); }
      else { SFX.error(); toast(t('no_coins')); }
    });
    $('sh-ad').onclick = () => watchAd('shop_coins', () => { S.coins += 50; store(); SFX.reward(); toast(t('plus_coins', 50)); setCoins(true); render(); });
  };
  render();
  $('scr-shop').classList.add('z30', 'modal'); showScr('shop');
}

// ---------------------------------------------------------------- GÜNLÜK HEDİYE
const DAILY = [20, 30, 40, 50, 60, 80, 120];
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function dailyAvailable() { return S.daily.last !== todayKey(); }
function maybeDaily() {
  if (!dailyAvailable()) return false;
  const yest = new Date(Date.now() - 864e5), yk = yest.getFullYear() + '-' + (yest.getMonth() + 1) + '-' + yest.getDate();
  const streak = S.daily.last === yk ? S.daily.streak : 0;       // dün aldıysa seri devam
  const day = streak % 7, reward = DAILY[day];
  $('scr-daily').innerHTML = '<div class="card glass strong"><div class="gift glass">' + IC.gift + '</div><h3>' + t('daily_gift') + '</h3><h2>' + t('day_n', day + 1) + '</h2>' +
    '<div class="days">' + DAILY.map((c, i) => '<div class="day' + (i < day ? ' done' : i === day ? ' today' : '') + '">' + t('day_short', i + 1) + '<br><b style="font-size:13px">' + (i === 6 ? '★' : c) + '</b></div>').join('') + '</div>' +
    '<div class="earn">' + coinSpan() + '<b>' + reward + '</b></div>' + (day === 6 ? '<p>' + t('daily_bonus') + '</p>' : '') +
    '<div class="btns"><button class="cta gold pulse" id="d-claim">' + t('claim') + '</button><button class="cta blue sm" id="d-dbl">' + IC.ad + ' ' + t('claim_x2') + '</button></div></div>';
  $('scr-daily').classList.add('z40', 'modal'); showScr('daily'); SFX.reward();
  const claim = mult => {
    S.daily.last = todayKey(); S.daily.streak = streak + 1; S.coins += reward * mult;
    if (day === 6) PU_KEYS.forEach(k => S.pu[k]++);
    store(); SFX.coin(); Haptic.ok(); hideScr('daily'); setCoins(true); toast(t('plus_coins', reward * mult));
  };
  $('d-claim').onclick = () => claim(1);
  $('d-dbl').onclick = () => watchAd('daily_x2', () => claim(2));
  return true;
}

// ---------------------------------------------------------------- EĞİTİM KARTLARI + REHBER
// Her öğenin ilk göründüğü bölüm (0 tabanlı). Öğe yeni olduğunda küçük bir kart gösterilir.
const FEAT_LV = (() => { const m = { pu: 2 }; LEVELS.forEach((l, i) => (l.intro || []).forEach(f => { if (m[f] === undefined) m[f] = i; })); return m; })();
function tutorialsFor(lv) {
  const keys = (lv.intro || []).slice(); if (lv.id === 2) keys.unshift('pu');
  return keys.filter(k => TUT[k] && !S.seen[k]).sort((a, b) => TUT_ORDER.indexOf(a) - TUT_ORDER.indexOf(b));
}
function showTut() {
  const k = tutQueue[0]; if (!k) { closeTut(); return; }
  const T = TUT[k], more = tutQueue.length > 1;
  S.seen[k] = 1; store(); tutFocus = k; phase = 'tut';
  document.body.classList.add('nohud');
  $('scr-tut').innerHTML = '<div class="card glass strong tut"><div class="tnew">' + (more ? t('tut_new_n', tutQueue.length) : t('tut_new_lv', curLv + 1)) + '</div>' +
    '<div class="trow"><div class="tsvg">' + T.svg + '</div><div class="ttx"><h2>' + tutTitle(k) + '</h2><p>' + tutDesc(k) + '</p></div></div>' +
    '<button class="cta green sm" id="t-ok">' + (more ? t('tut_next') : t('tut_ok')) + '</button></div>';
  showScr('tut'); SFX.powerup(); vib(10);
  $('t-ok').onclick = () => { SFX.ui(); tutQueue.shift(); if (tutQueue.length) showTut(); else closeTut(); };
}
function closeTut() {
  if (phase !== 'tut' && !tutQueue.length) return;
  tutQueue = []; tutFocus = null; hideScr('tut'); phase = 'aim'; document.body.classList.remove('nohud');
}
function openGuide(fromPause) {
  const ub = S.unlocked;
  const rows = TUT_ORDER.slice().sort((a, b) => FEAT_LV[a] - FEAT_LV[b]).map(k => {
    const T = TUT[k], open = FEAT_LV[k] < ub || S.seen[k];
    return '<div class="grow' + (open ? '' : ' lk') + '"><div class="gs">' + (open ? T.svg : '<div class="glock">' + IC.lock + '</div>') + '</div>' +
      '<div class="gt"><b>' + (open ? tutTitle(k) : '???') + '</b><span>' + (open ? tutDesc(k) : t('guide_locked', FEAT_LV[k] + 1)) + '</span></div></div>';
  }).join('');
  $('scr-guide').innerHTML = '<div class="card glass strong gcard"><button class="xbtn gbtn glass s" id="g-x">' + IC.close + '</button><h2>' + t('guide') + '</h2><h3>' + t('guide_sub') + '</h3><div class="glist">' + rows + '</div></div>';
  $('scr-guide').classList.add('z40', 'modal'); showScr('guide');
  $('g-x').onclick = () => hideScr('guide');
}

// ---------------------------------------------------------------- HARİTA (100 bölüm · 5 dünya × 20)
const DY = 88, TOPPAD = 76, BOTPAD = 130, SEC_H = TOPPAD + 19 * DY + BOTPAD, OVER = 90, MAP_TOP = 74, NW = 5;
const MAP_H = MAP_TOP + NW * SEC_H + 20;
const secTop = w => MAP_TOP + (NW - 1 - w) * SEC_H;
function nodePos(i) {
  const w = Math.floor(i / 20), j = i % 20;
  return { x: 200 + 92 * Math.sin((j + 1) * TAU / 10), y: secTop(w) + SEC_H - BOTPAD - 30 - j * DY };
}
// Sade dekor: her dünyada birkaç büyük, düşük kontrastlı şekil
function worldDecor(w, H) {
  const R = rng(300 + w * 17); let s = '';
  const rr = (a, b) => a + R() * (b - a);
  if (w === 0) {
    for (let i = 0; i < 9; i++) { const x = rr(20, 380), y = rr(60, H - 40), r = rr(36, 70); s += '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + r.toFixed(0) + '" ry="' + (r * .42).toFixed(0) + '" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>'; }
    for (let i = 0; i < 28; i++) s += '<circle cx="' + rr(0, 400).toFixed(0) + '" cy="' + rr(0, H).toFixed(0) + '" r="' + rr(1, 2.2).toFixed(1) + '" fill="#fff" opacity="' + rr(.2, .5).toFixed(2) + '"/>';
  } else if (w === 1) {
    for (let y = 60; y < H; y += 60) s += '<line x1="0" y1="' + y + '" x2="400" y2="' + y + '" stroke="rgba(160,140,255,.1)"/>';
    for (let x = 0; x <= 400; x += 50) s += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '" stroke="rgba(160,140,255,.1)"/>';
    for (let i = 0; i < 8; i++) { const x = rr(30, 370), y = rr(60, H - 60), r = rr(18, 38), c = i % 2 ? '#ff3df0' : '#25e8ff';
      s += i % 3 === 0 ? '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + r.toFixed(0) + '" fill="none" stroke="' + c + '" stroke-width="2" opacity=".28"/>' : '<rect x="' + (x - r).toFixed(0) + '" y="' + (y - r).toFixed(0) + '" width="' + (r * 2).toFixed(0) + '" height="' + (r * 2).toFixed(0) + '" rx="6" transform="rotate(' + rr(0, 45).toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')" fill="none" stroke="' + c + '" stroke-width="2" opacity=".28"/>'; }
  } else if (w === 2) {
    s += '<defs><radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a4d" stop-opacity="0"/></radialGradient></defs>';
    s += '<circle cx="300" cy="170" r="130" fill="url(#sun)" opacity=".75"/><circle cx="300" cy="170" r="40" fill="#fff0c4" opacity=".9"/>';
    for (let i = 0; i < 9; i++) { const x = rr(0, 400), y = rr(260, H - 80), w2 = rr(60, 120); s += '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + w2.toFixed(0) + '" ry="' + rr(10, 16).toFixed(0) + '" fill="rgba(255,200,205,.16)"/>'; }
  } else if (w === 3) {
    s += '<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38f0c0" stop-opacity="0"/><stop offset=".4" stop-color="#38f0c0" stop-opacity=".3"/><stop offset="1" stop-color="#6a7bff" stop-opacity="0"/></linearGradient></defs>';
    for (let i = 0; i < 6; i++) { const y = 80 + i * (H - 200) / 5, a = rr(20, 34); s += '<path d="M0 ' + y.toFixed(0) + ' C 100 ' + (y - a).toFixed(0) + ' 160 ' + (y + a).toFixed(0) + ' 260 ' + y.toFixed(0) + ' S 360 ' + (y - a).toFixed(0) + ' 400 ' + (y + 10).toFixed(0) + ' V ' + (y + 120).toFixed(0) + ' C 300 ' + (y + 150).toFixed(0) + ' 200 ' + (y + 90).toFixed(0) + ' 0 ' + (y + 130).toFixed(0) + ' Z" fill="url(#ar)" opacity=".7"/>'; }
    for (let i = 0; i < 50; i++) s += '<circle cx="' + rr(0, 400).toFixed(0) + '" cy="' + rr(0, H).toFixed(0) + '" r="' + rr(.6, 1.6).toFixed(1) + '" fill="#fff" opacity="' + rr(.25, .7).toFixed(2) + '"/>';
  } else {
    for (let y = 40; y < H; y += 150) { s += '<g opacity=".16" stroke="#ffe3a0" stroke-width="2" fill="none">'; for (let x = 0; x < 400; x += 80) s += '<path d="M' + x + ' ' + (y + 70) + ' V ' + (y + 30) + ' a40 40 0 0 1 80 0 V ' + (y + 70) + '"/>'; s += '</g>'; }
    for (let i = 0; i < 26; i++) s += '<circle cx="' + rr(0, 400).toFixed(0) + '" cy="' + rr(0, H).toFixed(0) + '" r="' + rr(1.2, 2.8).toFixed(1) + '" fill="#ffe9a8" opacity="' + rr(.25, .6).toFixed(2) + '"/>';
  }
  return '<svg width="400" height="' + H + '" viewBox="0 0 400 ' + H + '" style="position:absolute;inset:0">' + s + '</svg>';
}
function buildMap() {
  const inner = $('mapInner'); inner.style.height = MAP_H + 'px';
  let h = '';
  // Üstteki dünya en altta çizilir; alttaki dünyanın üst kenarı yumuşakça karışır
  for (let w = NW - 1; w >= 0; w--) {
    const W = WORLDS[w], y0 = secTop(w), topSec = w === NW - 1;
    const top = topSec ? 0 : y0 - OVER, hh = SEC_H + (topSec ? MAP_TOP : OVER) + (w === 0 ? 20 : 0);
    const mask = topSec ? '' : 'mask-image:linear-gradient(transparent,#000 ' + OVER + 'px);-webkit-mask-image:linear-gradient(transparent,#000 ' + OVER + 'px);';
    h += '<div class="wsec" style="top:' + top + 'px;height:' + hh + 'px;--wbg:linear-gradient(180deg,' + W.map[1] + ',' + W.map[0] + ');' + mask + '">' + worldDecor(w, hh) + '</div>';
  }
  h += '<svg id="mapSvg" width="400" height="' + MAP_H + '"></svg>';
  for (let w = 0; w < NW; w++) {
    const W = WORLDS[w], yb = secTop(w) + SEC_H - BOTPAD + 6;
    let got = 0; for (let i = w * 20; i < w * 20 + 20; i++) got += S.stars[i] || 0;
    h += '<div class="wban glass strong" style="top:' + yb + 'px;--wc:' + W.acc + '"><span>' + t('world_n', w + 1, got) + '</span><b>' + worldName(w) + '</b><div class="wp"><i style="width:' + (got / 60 * 100) + '%"></i></div></div>';
  }
  for (let i = 0; i < LEVELS.length; i++) {
    const p = nodePos(i), lv = LEVELS[i], tr = TIERS[lv.tier], st = S.stars[i] || 0;
    const locked = i >= S.unlocked, cur = i === S.unlocked - 1 && st === 0;
    h += '<div class="node' + (lv.boss ? ' boss' : '') + (locked ? ' lock' : st > 0 ? ' done' : '') + (cur ? ' cur' : '') + '" data-i="' + i + '" style="left:' + p.x.toFixed(1) + 'px;top:' + p.y + 'px;--tc:' + tr.col + ';--tcg:' + tr.glow + '">' +
      (lv.boss ? '<div class="ncrown">' + IC.crown + '</div>' : '') +
      '<div class="nb">' + (locked ? IC.lock : (i + 1)) + '</div><div class="nstars">' + (locked ? '' : [1, 2, 3].map(n => starSVG(st >= n)).join('')) + '</div>' +
      (cur ? '<div class="nlabel" style="' + (p.x < 200 ? 'left:' + (lv.boss ? 84 : 70) + 'px' : 'right:' + (lv.boss ? 84 : 70) + 'px') + '">' + tierName(lv.tier) + '</div>' : '') + '</div>';
  }
  inner.innerHTML = h;
  let d = '', dd = '';
  for (let i = 0; i < LEVELS.length - 1; i++) {
    const a = nodePos(i), b = nodePos(i + 1), my = (a.y + b.y) / 2, seg = 'M' + a.x.toFixed(1) + ' ' + a.y + ' C ' + a.x.toFixed(1) + ' ' + my + ' ' + b.x.toFixed(1) + ' ' + my + ' ' + b.x.toFixed(1) + ' ' + b.y + ' ';
    d += seg; if (i + 1 < S.unlocked) dd += seg;
  }
  $('mapSvg').innerHTML = '<path d="' + d + '" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>' +
    (dd ? '<path d="' + dd + '" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9" stroke-linecap="round"/><path d="' + dd + '" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>' : '');
  inner.querySelectorAll('.node').forEach(n => n.onclick = () => {
    const i = +n.dataset.i; initAudio();
    if (i >= S.unlocked) { SFX.error(); vib(20); n.classList.remove('shk'); void n.offsetWidth; n.classList.add('shk'); toast(t('locked_toast')); return; }
    SFX.ui(); startLevel(i);
  });
}
function mapCurrentY() { return clamp(nodePos(clamp(S.unlocked - 1, 0, LEVELS.length - 1)).y - 380, 0, MAP_H); }
function updateMapHead() {
  $('maptitle').innerHTML = t('map_title') + '<small>' + t('stars_total', totalStars(), LEVELS.length * 3) + '</small>';
  $('mapcoins').textContent = S.coins;
}
function openMap() {
  phase = 'map'; hideAll(); document.body.classList.add('nohud'); Music.start(-1);
  const cw = clamp(Math.floor((S.unlocked - 1) / 20), 0, NW - 1); applyTheme(cw);
  buildMap();
  updateMapHead();
  showScr('map');
  const sc2 = $('mapScroll'), tgt = mapCurrentY();
  sc2.scrollTop = clamp(tgt + 300, 0, MAP_H);
  requestAnimationFrame(() => sc2.scrollTo({ top: tgt, behavior: 'smooth' }));
}
$('map-back').onclick = () => showTitle();
$('map-shop').onclick = () => openShop(true);
$('map-set').onclick = () => openSettings(false);
$('map-cur').onclick = () => { SFX.ui(); $('mapScroll').scrollTo({ top: mapCurrentY(), behavior: 'smooth' }); };
$('map-guide').onclick = () => { SFX.ui(); openGuide(false); };

// ---------------------------------------------------------------- BAŞLATMA
(function init() {
  quality.dpr = Math.min(devicePixelRatio || 1, 2);
  if (/Android|iPhone|iPad/i.test(navigator.userAgent) && (navigator.hardwareConcurrency || 8) <= 4) { quality.dpr = Math.min(quality.dpr, 1.5); }
  setLang(S.set.lang || detectLang(), true);
  setSfx(S.set.sfx); A.musOn = S.set.music;
  AdService.init();
  ['pause', 'back', 'close'].forEach(() => {});
  $('btn-pause').innerHTML = IC.pause;
  $('btn-tshop').innerHTML = IC.shop; $('btn-tset').innerHTML = IC.gear;
  $('btn-play').innerHTML = IC.play + '<span></span>';
  $('map-back').innerHTML = IC.back; $('map-shop').innerHTML = IC.shop; $('map-set').innerHTML = IC.gear;
  $('adx').innerHTML = IC.close;
  $('left-ic').innerHTML = IC.target;
  applyStaticLang();
  resize();
  showTitle();
  requestAnimationFrame(loop);
  setTimeout(() => { if (phase === 'title') maybeDaily(); }, 900);
  // Android geri tuşu (Capacitor App eklentisi varsa)
  try {
    const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (App && App.addListener) App.addListener('backButton', () => {
      if (document.querySelector('#scr-shop.show,#scr-settings.show,#scr-offer.show,#scr-guide.show')) { hideScr('shop'); hideScr('settings'); hideScr('offer'); hideScr('guide'); return; }
      if (phase === 'tut') { closeTut(); return; }
      if (phase === 'aim' || phase === 'fly') pauseGame(); else if (phase === 'pause') resumeGame(); else if (phase === 'map') showTitle(); else if (phase === 'title') App.exitApp && App.exitApp(); else openMap();
    });
  } catch (e) {}
})();

</script>
